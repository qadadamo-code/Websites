<!doctype html>
<html lang="ar" dir="rtl" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كوميز فرنيتشر | Komy's Furniture</title>

<meta name="theme-color" content="#F4EDE3">
<meta property="og:title" content="Komy's Furniture | كوميز فرنيتشر">
<meta property="og:description" content="أثاث يعيش معاك اليوم كله. من الصبح لحد آخر الليل.">
<meta property="og:image" content="https://web.theplanetco.com/komys/assets/img/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="assets/img/icon.png">
<link rel="apple-touch-icon" href="assets/img/icon.png">
<link rel="preload" href="assets/fonts/IBMPlexSansArabic-400n-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/InterTight-300_700n-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/seq/f001.webp" as="image">
<link rel="stylesheet" href="assets/css/fonts.css?v=1">
<link rel="stylesheet" href="assets/css/style.css?v=1">

</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="km-mark" viewBox="0 0 120 140">
      <path d="M8 136 V62 A52 52 0 0 1 112 62 V136 Z" style="fill:var(--mka,#B5583A)"/>
      <g style="stroke:var(--mkk,#F4EDE3)" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M42 50 V114"/><path d="M42 88 L74 52"/><path d="M52 90 H72 Q84 90 84 102 V114"/></g>
    </symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.3C1.4 7.8 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.3 4.3 6.7-1.8 4.7-9.3 9.3-9.3 9.3z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </defs>
</svg>

<!-- INTRO -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro__stage">
    <svg class="intro__mark" viewBox="0 0 120 140"><path class="ia" d="M8 136 V62 A52 52 0 0 1 112 62 V136 Z"/><g class="ik"><path d="M42 50 V114"/><path d="M42 88 L74 52"/><path d="M52 90 H72 Q84 90 84 102 V114"/></g></svg>
    <div class="intro__word">KOMY<i>’</i>S<small>FURNITURE</small></div>
  </div>
  <button class="intro__skip" id="introSkip" data-i18n="intro.skip">تخطي</button>
</div>

<!-- HEADER -->
<header class="hdr" id="hdr">
  <a class="brand" href="#top" aria-label="Komy's Furniture">
    <svg class="brand__mark"><use href="#km-mark"/></svg>
    <span class="brand__txt"><b>KOMY<i>’</i>S</b><small data-i18n="brand.sub">للأثاث</small></span>
  </a>
  <nav class="nav" id="nav" aria-label="main">
    <a href="#rooms" data-i18n="nav.rooms"></a>
    <a href="#studio" data-i18n="nav.studio"></a>
    <a href="#shop" data-i18n="nav.shop"></a>
    <a href="#planner" data-i18n="nav.planner"></a>
    <a href="#craft" data-i18n="nav.craft"></a>
    <a href="#visit" data-i18n="nav.visit"></a>
  </nav>
  <div class="tools">
    <button class="lang" id="langBtn" aria-label="Language"><span id="langLbl">EN</span></button>
    <button class="theme" id="themeBtn" aria-label="Day / Night">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button class="listbtn" id="listBtn" aria-label="My list"><svg><use href="#i-heart"/></svg><em id="listCount">0</em></button>
    <a class="btn btn--wa btn--sm hdr__wa" data-wa><svg><use href="#i-wa"/></svg><span data-i18n="cta.wa"></span></a>
    <button class="burger" id="burger" aria-label="Menu"><span></span><span></span></button>
  </div>
</header>

<main id="top">

<!-- HERO: a day in one room -->
<section class="hero" id="hero">
  <div class="hero__pin">
    <canvas class="hero__cv" id="heroCv"></canvas>
    <div class="hero__shade"></div>
    <div class="hero__clock" aria-hidden="true">
      <svg viewBox="0 0 200 110"><path class="arc" d="M10 100 A90 90 0 0 1 190 100"/><path class="arc arc--on" id="arcOn" d="M10 100 A90 90 0 0 1 190 100"/><circle class="orb" id="orb" cx="10" cy="100" r="7"/></svg>
      <div class="hero__time"><small data-i18n="hero.time"></small><b id="clockTxt">07:00</b></div>
    </div>
    <div class="hero__copy">
      <p class="eyebrow eyebrow--light" data-i18n="hero.eyebrow"></p>
      <div class="hero__steps">
        <div class="hstep is-on" data-step="0"><h1 data-i18n="hero.s1.t"></h1><p data-i18n="hero.s1.p"></p></div>
        <div class="hstep" data-step="1"><h2 data-i18n="hero.s2.t"></h2><p data-i18n="hero.s2.p"></p></div>
        <div class="hstep" data-step="2"><h2 data-i18n="hero.s3.t"></h2><p data-i18n="hero.s3.p"></p></div>
        <div class="hstep hstep--final" data-step="3"><h2 data-i18n="hero.final.t"></h2><p data-i18n="hero.final.p"></p>
          <div class="hero__ctas"><a class="btn btn--clay" href="#shop" data-i18n="cta.shop"></a><a class="btn btn--glass" data-wa><svg><use href="#i-wa"/></svg><span data-i18n="cta.wa"></span></a></div>
        </div>
      </div>
    </div>
    <div class="hero__hint"><span data-i18n="hero.scroll"></span><i></i></div>
    <div class="hero__bar"><i id="heroBar"></i></div>
  </div>
</section>

<!-- STATS -->
<section class="stats">
  <div class="wrap stats__grid">
    <div class="stat"><b data-count="12">0</b><span data-i18n="stat.years"></span></div>
    <div class="stat"><b data-count="4800" data-plus>0</b><span data-i18n="stat.homes"></span></div>
    <div class="stat"><b data-count="350" data-plus>0</b><span data-i18n="stat.pieces"></span></div>
    <div class="stat"><b data-count="5">0</b><span data-i18n="stat.warranty"></span></div>
  </div>
</section>

<!-- ROOMS -->
<section class="rooms" id="rooms">
  <div class="rooms__pin">
    <div class="wrap rooms__head">
      <div><p class="eyebrow" data-i18n="rooms.eyebrow"></p><h2 class="h2" data-i18n="rooms.title"></h2></div>
      <p class="lead" data-i18n="rooms.sub"></p>
    </div>
    <div class="rooms__track" id="roomsTrack"></div>
  </div>
</section>

<!-- FABRIC STUDIO -->
<section class="studio" id="studio">
  <div class="wrap">
    <div class="sec-head"><p class="eyebrow" data-i18n="studio.eyebrow"></p><h2 class="h2" data-i18n="studio.title"></h2><p class="lead" data-i18n="studio.sub"></p></div>
    <div class="studio__grid">
      <div class="studio__stage" id="stStage">
        <div class="studio__imgs" id="stImgs"></div>
        <span class="studio__badge" id="stBadge"></span>
      </div>
      <aside class="studio__panel">
        <p class="studio__model" data-i18n="studio.model"></p>
        <h3 class="studio__fab" id="stFabName"></h3>
        <p class="lbl" data-i18n="studio.fabric"></p>
        <div class="swatches" id="stSw"></div>
        <p class="lbl" data-i18n="studio.size"></p>
        <div class="seg" id="stSize"></div>
        <div class="studio__price"><span data-i18n="studio.price"></span><b id="stPrice"></b></div>
        <a class="btn btn--clay btn--block" id="stOrder"><svg><use href="#i-wa"/></svg><span data-i18n="studio.order"></span></a>
        <p class="note" data-i18n="studio.note"></p>
      </aside>
    </div>
    <div class="compare" id="compare">
      <img src="assets/img/hero_night.webp" alt="" loading="lazy">
      <div class="compare__top" id="cmpTop"><img src="assets/img/hero_day.webp" alt="" loading="lazy"></div>
      <div class="compare__handle" id="cmpHandle"><span></span></div>
      <em class="compare__l" data-i18n="studio.day"></em><em class="compare__r" data-i18n="studio.night"></em>
      <p class="compare__cap" data-i18n="studio.compare"></p>
    </div>
  </div>
</section>

<!-- SHOP -->
<section class="shop" id="shop">
  <div class="wrap">
    <div class="sec-head sec-head--row"><div><p class="eyebrow" data-i18n="shop.eyebrow"></p><h2 class="h2" data-i18n="shop.title"></h2></div><div class="chips" id="chips"></div></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<!-- PLANNER -->
<section class="planner" id="planner">
  <div class="wrap planner__grid">
    <div>
      <p class="eyebrow" data-i18n="plan.eyebrow"></p>
      <h2 class="h2" data-i18n="plan.title"></h2>
      <p class="lead" data-i18n="plan.sub"></p>
      <div class="q"><p class="q__t"><i>1</i><span data-i18n="plan.q1"></span></p><div class="seg seg--wrap" id="plRoom"></div></div>
      <div class="q"><p class="q__t"><i>2</i><span data-i18n="plan.q2"></span></p><div class="seg" id="plSize"></div></div>
      <div class="q"><p class="q__t"><i>3</i><span data-i18n="plan.q3"></span></p><div class="moods" id="plMood"></div></div>
    </div>
    <div class="ticket" id="ticket">
      <div class="ticket__top">
        <svg class="ticket__mark"><use href="#km-mark"/></svg>
        <p class="lbl" data-i18n="plan.result"></p>
        <h3 id="tkTitle"></h3>
        <div class="ticket__pal" id="tkPal"></div>
      </div>
      <div class="ticket__body">
        <p class="lbl" data-i18n="plan.inc"></p>
        <p id="tkInc"></p>
        <div class="ticket__price"><span data-i18n="plan.from"></span><b id="tkPrice"></b></div>
        <p class="ticket__free" data-i18n="plan.free"></p>
        <a class="btn btn--clay btn--block" id="tkSend"><svg><use href="#i-wa"/></svg><span data-i18n="plan.send"></span></a>
      </div>
    </div>
  </div>
</section>

<!-- CRAFT -->
<section class="craft" id="craft">
  <div class="craft__media"><img src="assets/img/craft.webp" alt="" loading="lazy"></div>
  <div class="wrap craft__inner">
    <div class="sec-head"><p class="eyebrow" data-i18n="craft.eyebrow"></p><h2 class="h2" data-i18n="craft.title"></h2><p class="lead" data-i18n="craft.sub"></p></div>
    <ol class="steps">
      <li><b>01</b><h3 data-i18n="c1.t"></h3><p data-i18n="c1.p"></p></li>
      <li><b>02</b><h3 data-i18n="c2.t"></h3><p data-i18n="c2.p"></p></li>
      <li><b>03</b><h3 data-i18n="c3.t"></h3><p data-i18n="c3.p"></p></li>
      <li><b>04</b><h3 data-i18n="c4.t"></h3><p data-i18n="c4.p"></p></li>
    </ol>
  </div>
  <div class="perks"><div class="perks__run" id="perks"></div></div>
</section>

<!-- REVIEWS -->
<section class="reviews">
  <div class="wrap">
    <div class="sec-head"><p class="eyebrow" data-i18n="rev.eyebrow"></p><h2 class="h2" data-i18n="rev.title"></h2></div>
    <div class="revs">
      <figure class="rev"><span class="stars">★★★★★</span><blockquote data-i18n="r1"></blockquote><figcaption data-i18n="r1n"></figcaption></figure>
      <figure class="rev"><span class="stars">★★★★★</span><blockquote data-i18n="r2"></blockquote><figcaption data-i18n="r2n"></figcaption></figure>
      <figure class="rev"><span class="stars">★★★★★</span><blockquote data-i18n="r3"></blockquote><figcaption data-i18n="r3n"></figcaption></figure>
      <figure class="rev"><span class="stars">★★★★★</span><blockquote data-i18n="r4"></blockquote><figcaption data-i18n="r4n"></figcaption></figure>
    </div>
    <p class="note" data-i18n="rev.note"></p>
  </div>
</section>

<!-- VISIT -->
<section class="visit" id="visit">
  <div class="wrap visit__grid">
    <div class="visit__media"><img src="assets/img/showroom.webp" alt="" loading="lazy"></div>
    <div class="visit__box">
      <p class="eyebrow" data-i18n="visit.eyebrow"></p>
      <h2 class="h2" data-i18n="visit.title"></h2>
      <p class="lead" data-i18n="visit.sub"></p>
      <dl class="info">
        <div><dt data-i18n="visit.addr"></dt><dd data-i18n="visit.addrV"></dd></div>
        <div><dt data-i18n="visit.hours"></dt><dd data-i18n="visit.hoursV"></dd></div>
        <div><dt data-i18n="visit.phone"></dt><dd><a data-tel dir="ltr"><span data-phone></span></a></dd></div>
      </dl>
      <form class="form" id="form">
        <label><span data-i18n="f.name"></span><input name="name" required autocomplete="name"></label>
        <label><span data-i18n="f.phone"></span><input name="phone" required inputmode="tel" dir="ltr" autocomplete="tel"></label>
        <label class="full"><span data-i18n="f.room"></span><select name="room" id="fRoom"></select></label>
        <label class="full"><span data-i18n="f.msg"></span><textarea name="msg" rows="3"></textarea></label>
        <button class="btn btn--clay btn--block full" type="submit"><svg><use href="#i-wa"/></svg><span data-i18n="f.send"></span></button>
      </form>
    </div>
  </div>
</section>

</main>

<footer class="foot">
  <div class="wrap foot__grid">
    <div>
      <a class="brand brand--foot" href="#top"><svg class="brand__mark"><use href="#km-mark"/></svg><span class="brand__txt"><b>KOMY<i>’</i>S</b><small data-i18n="brand.sub"></small></span></a>
      <p data-i18n="foot.tag"></p>
    </div>
    <div><p class="lbl" data-i18n="foot.links"></p><a href="#rooms" data-i18n="nav.rooms"></a><a href="#studio" data-i18n="nav.studio"></a><a href="#shop" data-i18n="nav.shop"></a><a href="#planner" data-i18n="nav.planner"></a></div>
    <div><p class="lbl" data-i18n="foot.contact"></p><a data-wa><span data-i18n="cta.wa"></span></a><a data-tel dir="ltr"><span data-phone></span></a></div>
  </div>
  <div class="wrap foot__bar"><span>© 2026 Komy's Furniture · <span data-i18n="foot.rights"></span></span><span><span data-i18n="foot.by"></span> <a href="https://web.theplanetco.com/" target="_blank" rel="noopener">Planet Creative Marketing</a></span></div>
</footer>

<a class="fab-wa" data-wa aria-label="WhatsApp"><svg><use href="#i-wa"/></svg></a>

<!-- LIST DRAWER -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer__bg" data-close></div>
  <div class="drawer__panel">
    <div class="drawer__head"><h3 data-i18n="list.title"></h3><button class="icon" data-close aria-label="close"><svg><use href="#i-x"/></svg></button></div>
    <div class="drawer__items" id="drItems"></div>
    <div class="drawer__foot"><div class="drawer__total"><span data-i18n="list.total"></span><b id="drTotal"></b></div><a class="btn btn--clay btn--block" id="drSend"><svg><use href="#i-wa"/></svg><span data-i18n="list.send"></span></a><button class="linkbtn" id="drClear" data-i18n="list.clear"></button></div>
  </div>
</aside>

<!-- QUICK VIEW -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__bg" data-close></div>
  <div class="modal__card">
    <button class="icon modal__x" data-close aria-label="close"><svg><use href="#i-x"/></svg></button>
    <div class="modal__img"><img id="mdImg" alt=""></div>
    <div class="modal__body">
      <p class="lbl" id="mdCat"></p><h3 id="mdName"></h3><p id="mdDesc"></p>
      <div class="price"><b id="mdPrice"></b><s id="mdOld"></s></div>
      <p class="inst" id="mdInst"></p>
      <div class="modal__acts"><button class="btn btn--ghost" id="mdAdd"></button><a class="btn btn--clay" id="mdAsk"><svg><use href="#i-wa"/></svg><span data-i18n="shop.ask"></span></a></div>
    </div>
  </div>
</div>

<script src="assets/js/vendor/gsap.min.js"></script>
<script src="assets/js/vendor/ScrollTrigger.min.js"></script>
<script src="assets/js/vendor/lenis.min.js"></script>
<script src="assets/js/data.js?v=1"></script>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/app.js?v=1"></script>
</body>
</html>
