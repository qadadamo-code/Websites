<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;src:url(assets/ibm-plex-sans-arabic-arabic-400-normal.woff2);font-weight:400;unicode-range:U+0020,U+0600-06FF,U+FB50-FEFF,U+200C-200F}
@font-face{font-family:Plex;src:url(assets/ibm-plex-sans-arabic-arabic-600-normal.woff2);font-weight:600;unicode-range:U+0020,U+0600-06FF,U+FB50-FEFF,U+200C-200F}
@font-face{font-family:Plex;src:url(assets/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700;unicode-range:U+0020,U+0600-06FF,U+FB50-FEFF,U+200C-200F}
@font-face{font-family:Plex;src:url(assets/inter-tight-latin-600-normal.woff2);font-weight:600;unicode-range:U+0021-024F}
@font-face{font-family:Plex;src:url(assets/inter-tight-latin-700-normal.woff2);font-weight:700;unicode-range:U+0021-024F}
@font-face{font-family:Plex;src:url(assets/inter-tight-latin-600-normal.woff2);font-weight:400;unicode-range:U+0021-024F}
html,body{margin:0;background:#060a10}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, CX = 540, CY = 1054, R = 200;
const MINT = '#92C5B4', NEON = '#A9E4CF', NAVY = '#143659', GREY = '#56616c';
const c = document.getElementById('c'), x = c.getContext('2d');
const PLOGO = new Path2D('M 3 207.045 L 3 414.158 43.250 413.754 C 77.062 413.414, 84.460 413.080, 89.500 411.666 C 111.693 405.440, 127.708 389.436, 136.199 365 L 139.500 355.500 139.772 225.750 L 140.044 96 196.862 96 C 257.722 96, 261.970 96.313, 272.099 101.551 C 290.101 110.860, 297.302 138.725, 287.074 159.500 C 280.128 173.610, 266.280 180.974, 246.614 181.015 C 223.776 181.062, 206.885 192.216, 198.931 212.500 C 196.693 218.209, 196.561 219.896, 196.209 247.250 L 195.839 276 230.170 275.997 C 278.250 275.992, 297.667 273.770, 322.756 265.403 C 372.722 248.739, 402.968 215.662, 413.674 165.976 C 416.199 154.254, 416.203 123.352, 413.681 110.730 C 401.841 51.485, 360.489 15.813, 288.500 2.743 C 276.614 0.585, 275.206 0.561, 139.750 0.248 L 3 -0.068 3 207.045');

const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const k01 = (t, a, b) => cl((t - a) / (b - a));
const eo = (p) => 1 - Math.pow(1 - p, 3);
const eio = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = (p) => { const s = 2.2; p -= 1; return 1 + p * p * ((s + 1) * p + s); };
const lerp = (a, b, p) => a + (b - a) * p;
const mix = (h1, h2, p) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const r = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, p)); return `rgb(${r(16)},${r(8)},${r(0)})`; };

// 7 features, positions mirror the reference layout (icon centre, label below)
const F = [
  { p: [696, 694], l: ['هوية', 'بصرية'], ic: 'pen' },
  { p: [880, 945], l: ['إعلانات', 'ممولة'], ic: 'mega' },
  { p: [810, 1238], l: ['إدارة', 'السوشيال'], ic: 'chat' },
  { p: [540, 1372], l: ['مواقع', 'إلكترونية'], ic: 'globe' },
  { p: [270, 1238], l: ['تطبيقات', 'موبايل'], ic: 'phone' },
  { p: [200, 945], l: ['تسويق', 'وظهور بجوجل'], ic: 'search' },
  { p: [384, 694], l: ['تصوير', 'ومونتاج'], ic: 'play' },
];
F.forEach((f) => { let a = Math.atan2(f.p[0] - CX, -(f.p[1] - CY)) * 180 / Math.PI; if (a < 0) a += 360; f.a = a; });
const ANG = [0, ...F.map((f) => f.a), 360];
const T = [0, 1.2, 2.2, 3.2, 4.2, 5.2, 6.2, 7.2, 8.4]; // beat hits
function handAngle(t) {
  let a = 0;
  for (let k = 1; k < T.length; k++) {
    const p = k01(t, T[k] - 0.14, T[k] + 0.12);
    if (p <= 0) break;
    a = lerp(ANG[k - 1], ANG[k], back(p));
  }
  return a;
}
function beatPulse(t) { let v = 0; for (let k = 1; k < T.length; k++) { const d = t - T[k]; if (d >= -0.02 && d < 0.6) v = Math.max(v, Math.exp(-Math.max(0, d) * 7)); } return v; }

function icon(n, s, col, w) {
  x.save(); x.scale(s, s); x.strokeStyle = col; x.fillStyle = col; x.lineWidth = w / s; x.lineJoin = 'round'; x.lineCap = 'round';
  x.beginPath();
  if (n === 'pen') { x.moveTo(0, -30); x.lineTo(19, -2); x.lineTo(9, 26); x.lineTo(-9, 26); x.lineTo(-19, -2); x.closePath(); x.moveTo(0, -30); x.lineTo(0, -6); x.stroke(); x.beginPath(); x.arc(0, 0, 5.5, 0, 7); x.stroke(); x.beginPath(); x.moveTo(-12, 33); x.lineTo(12, 33); }
  if (n === 'phone') { x.roundRect(-18, -31, 36, 62, 8); x.moveTo(-6, 22); x.lineTo(6, 22); }
  if (n === 'chat') { x.arc(0, -3, 25, Math.PI * 0.78, Math.PI * 0.62 + Math.PI * 2); x.lineTo(-22, 26); x.closePath(); x.stroke(); x.beginPath(); [-10, 0, 10].forEach((d) => { x.moveTo(d, -3); x.arc(d, -3, 2.6, 0, 7); }); x.fill(); x.beginPath(); }
  if (n === 'dash') { x.roundRect(-31, -25, 62, 50, 6); x.moveTo(-31, -11); x.lineTo(31, -11); x.moveTo(-12, -11); x.lineTo(-12, 25); x.moveTo(-3, 0); x.lineTo(21, 0); x.moveTo(-3, 12); x.lineTo(14, 12); }
  if (n === 'globe') { x.arc(0, 0, 28, 0, 7); x.moveTo(12, 0); x.ellipse(0, 0, 12, 28, 0, 0, 7); x.moveTo(-28, 0); x.lineTo(28, 0); }
  if (n === 'search') { x.arc(-6, -6, 19, 0, 7); x.moveTo(8, 8); x.lineTo(27, 27); }
  if (n === 'mega') { x.moveTo(-26, -9); x.lineTo(-10, -9); x.lineTo(16, -26); x.lineTo(16, 26); x.lineTo(-10, 9); x.lineTo(-26, 9); x.closePath(); x.moveTo(-18, 9); x.lineTo(-13, 28); x.moveTo(24, -10); x.quadraticCurveTo(32, 0, 24, 10); }
  if (n === 'play') { x.roundRect(-30, -22, 60, 44, 8); x.moveTo(-7, -11); x.lineTo(12, 0); x.lineTo(-7, 11); x.closePath(); }
  if (n === 'moon') { x.arc(0, 0, 25, 0, 7); x.stroke(); x.beginPath(); x.arc(0, 0, 25, Math.PI / 2, Math.PI * 1.5); x.closePath(); x.fill(); x.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; x.moveTo(Math.cos(a) * 31, Math.sin(a) * 31); x.lineTo(Math.cos(a) * 37, Math.sin(a) * 37); } }
  x.stroke(); x.restore();
}

function txt(s, X, Y, font, col, ls = 0, align = 'center') {
  x.font = font; x.fillStyle = col; x.textAlign = align; x.textBaseline = 'middle'; x.letterSpacing = ls + 'px'; x.direction = 'rtl'; x.fillText(s, X, Y); x.letterSpacing = '0px';
}
function typed(s, p) { const ch = [...s]; return ch.slice(0, Math.ceil(ch.length * p)).join(''); }

function clockScene(t) {
  // background: navy-black with soft centre light
  const g = x.createRadialGradient(CX, 980, 40, CX, 980, 1150);
  g.addColorStop(0, '#16222f'); g.addColorStop(0.55, '#0b121b'); g.addColorStop(1, '#04070b');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const bp = beatPulse(t);
  const ha = handAngle(t), full = k01(t, 8.4, 8.75);

  // header
  txt('جه وقت', CX, 448, '600 42px Plex', '#ffffff', 0);
  x.save(); x.shadowColor = MINT; x.shadowBlur = 18 + bp * 10;
  txt('تنطلق', CX, 548, '700 150px Plex', NEON); x.restore();

  // dial
  x.save(); x.fillStyle = 'rgba(255,255,255,0.035)'; x.beginPath(); x.arc(CX, CY, R, 0, 7); x.fill();
  x.strokeStyle = 'rgba(255,255,255,0.09)'; x.lineWidth = 3; x.stroke();
  x.strokeStyle = 'rgba(255,255,255,0.22)'; x.lineWidth = 3; x.lineCap = 'round';
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; if (i % 3 === 0) continue; x.beginPath(); x.moveTo(CX + Math.sin(a) * 160, CY - Math.cos(a) * 160); x.lineTo(CX + Math.sin(a) * 174, CY - Math.cos(a) * 174); x.stroke(); }
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; if (i === 0) continue; x.beginPath(); x.moveTo(CX + Math.sin(a) * 150, CY - Math.cos(a) * 150); x.lineTo(CX + Math.sin(a) * 174, CY - Math.cos(a) * 174); x.stroke(); }
  x.restore();

  // neon progress arc
  if (ha > 0.3) {
    x.save(); x.lineCap = 'round'; x.strokeStyle = NEON; x.lineWidth = 9; x.shadowColor = MINT;
    const glow = 22 + bp * 16 + full * 26;
    x.beginPath(); x.arc(CX, CY, R, -Math.PI / 2, -Math.PI / 2 + Math.min(ha, 360) * Math.PI / 180);
    x.shadowBlur = glow; x.stroke(); x.shadowBlur = glow * 0.4; x.stroke(); x.restore();
  }

  // features
  F.forEach((f, i) => {
    const k = i + 1, Tk = T[k];
    const on = k01(t, Tk - 0.06, Tk + 0.14);
    if (on <= 0) return;
    const dim = (k < 7 ? k01(t, Tk + 0.88, Tk + 1.02) : k01(t, 8.1, 8.25)) * (1 - k01(t, 8.62, 8.76));
    const [X, Y] = f.p;
    // ring pop
    const rp = k01(t, Tk - 0.12, Tk + 0.06), rf = 1 - k01(t, Tk + 0.3, Tk + 0.65);
    if (rp > 0 && rf > 0) {
      x.save(); x.globalAlpha = rf * 0.9; x.strokeStyle = NEON; x.lineWidth = 3; x.shadowColor = MINT; x.shadowBlur = 16;
      x.beginPath(); x.arc(X, Y, lerp(14, 52, eo(rp)), 0, 7); x.stroke(); x.restore();
    }
    const col = mix('#ffffff', GREY, dim);
    x.save(); x.translate(X, Y);
    if (dim < 0.5) { x.shadowColor = 'rgba(255,255,255,0.55)'; x.shadowBlur = 14 * (1 - dim * 2); }
    icon(f.ic, 0.95 * lerp(0.55, 1, back(on)), col, 5.5); x.restore();
    const lp = k01(t, Tk + 0.02, Tk + 0.36);
    const n1 = [...f.l[0]].length, n2 = [...f.l[1]].length, tot = n1 + n2;
    const p1 = cl(lp * tot / n1), p2 = cl((lp * tot - n1) / n2);
    txt(typed(f.l[0], p1), X, Y + 70, '600 31px Plex', col, 1);
    if (p2 > 0) txt(typed(f.l[1], p2), X, Y + 108, '600 31px Plex', col, 1);
  });

  // minute hand (fixed at 12, mint neon, extends above dial)
  x.save(); x.lineCap = 'round'; x.strokeStyle = NEON; x.fillStyle = NEON; x.shadowColor = MINT; x.shadowBlur = 20 + bp * 10 + full * 16;
  x.lineWidth = 11; x.beginPath(); x.moveTo(CX, CY - 24); x.lineTo(CX, CY - 405); x.stroke();
  x.beginPath(); x.moveTo(CX, CY - R - 22); x.lineTo(CX + 11, CY - R); x.lineTo(CX, CY - R + 22); x.lineTo(CX - 11, CY - R); x.closePath(); x.fill();
  x.restore();

  // hour hand (white, rotates)
  x.save(); x.translate(CX, CY); x.rotate(ha * Math.PI / 180); x.lineCap = 'round';
  x.shadowColor = 'rgba(255,255,255,0.6)'; x.shadowBlur = 10; x.strokeStyle = '#fff'; x.fillStyle = '#fff'; x.lineWidth = 10;
  x.beginPath(); x.moveTo(0, -24); x.lineTo(0, -148); x.stroke();
  x.beginPath(); x.arc(0, -112, 10, 0, 7); x.fill();
  x.restore();

  // centre hub
  x.save(); x.fillStyle = '#0c141d'; x.strokeStyle = NEON; x.lineWidth = 6; x.shadowColor = MINT; x.shadowBlur = 16;
  x.beginPath(); x.arc(CX, CY, 22, 0, 7); x.fill(); x.stroke(); x.restore();

  // finale: centre fills with glowing mint, then floods the screen
  const fill = k01(t, 9.05, 9.38), flood = k01(t, 9.36, 9.5);
  if (fill > 0) {
    const r = lerp(22, 150, eio(fill)) + lerp(0, 2300, Math.pow(flood, 2.2));
    x.save(); const gg = x.createRadialGradient(CX, CY, 0, CX, CY, r);
    gg.addColorStop(0, '#E9FFF7'); gg.addColorStop(0.55, NEON); gg.addColorStop(1, MINT);
    x.fillStyle = gg; x.shadowColor = NEON; x.shadowBlur = 60 + fill * 60; x.beginPath(); x.arc(CX, CY, r, 0, 7); x.fill(); x.restore();
  }
}

function endScene(t) {
  x.fillStyle = MINT; x.fillRect(0, 0, W, H);
  const lk = eo(k01(t, 9.5, 9.85)), s = lerp(1.12, 1, lk);
  x.save(); x.translate(CX, 930); x.scale(s, s); x.globalAlpha = cl(k01(t, 9.5, 9.6) * 1);
  // P mark + dot
  const ps = 0.42, PX = -372, PY = -86; x.save(); x.translate(PX, PY); x.scale(ps, ps); x.fillStyle = NAVY; x.fill(PLOGO); x.restore();
  x.fillStyle = '#ffffff'; x.beginPath(); x.arc(PX + 419 * ps * 0.99, PY + 414 * ps * 0.84, 419 * ps * 0.12, 0, 7); x.fill();
  x.font = '700 172px Plex'; x.fillStyle = NAVY; x.textAlign = 'left'; x.textBaseline = 'middle'; x.direction = 'ltr'; x.letterSpacing = '-5px'; x.fillText('Planet', -150, 4); x.letterSpacing = '0px';
  x.restore();
  // pill
  const pp = k01(t, 9.82, 10.05);
  if (pp > 0) {
    const ps2 = back(pp); x.save(); x.translate(CX, 1112); x.scale(ps2, ps2);
    x.fillStyle = NAVY; x.beginPath(); x.roundRect(-190, -42, 380, 84, 42); x.fill();
    txt('ابدأ معانا  ←', 0, 2, '700 36px Plex', MINT); x.restore();
  }
  const cp = eo(k01(t, 10.1, 10.45));
  if (cp > 0) {
    x.save(); x.globalAlpha = cp;
    txt('واتساب 01203101104', CX, 1226 + (1 - cp) * 14, '600 34px Plex', NAVY);
    txt('theplanetco.com', CX, 1276 + (1 - cp) * 14, '600 30px Plex', 'rgba(20,54,89,0.72)', 2);
    x.restore();
  }
}

window.renderAt = (t) => { x.setTransform(1, 0, 0, 1, 0, 0); if (t < 9.5) clockScene(t); else endScene(t); };
Promise.all(['400', '600', '700'].map((w) => document.fonts.load(`${w} 40px Plex`, 'تنطلق Planet 0123'))).then(() => document.fonts.ready).then(() => { window.renderAt(0); window.ready = true; });
</script></body></html>
