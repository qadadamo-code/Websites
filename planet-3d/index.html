<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بلانت | نبني عالمك الرقمي</title>
<meta name="description" content="بلانت: مواقع، إعلانات، محتوى وهوية. جولة ثلاثية الأبعاد في كوكب بلانت.">
<meta name="theme-color" content="#060a1a">
<meta property="og:title" content="Planet | كوكب بلانت">
<meta property="og:description" content="مواقع، إعلانات، محتوى وهوية… بنبنيهم مع بعض في كوكب واحد.">
<link rel="icon" href="assets/brand/mark-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=1">
<script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.min.js" } }</script>
</head>
<body>

<div id="loader">
  <div class="lmark">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="lorbit" cx="60" cy="60" r="54" />
      <path class="lp" d="M40 92V28h22a18 18 0 0 1 0 36H40" />
      <circle class="ldot" cx="84" cy="86" r="7" />
    </svg>
  </div>
  <div class="lbar"><b></b></div>
  <div class="lmeta"><span data-t="loader"></span><span class="lpct">0</span></div>
</div>

<canvas id="gl" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="veil" aria-hidden="true"></div>
<div id="hotspots"></div>

<header class="top">
  <a class="logo" href="#top" aria-label="Planet">
    <img class="logo-dark" src="assets/brand/mark-dark.png" alt="">
    <img class="logo-light" src="assets/brand/mark-light.png" alt="">
    <span>PLANET</span>
  </a>
  <nav class="links">
    <a href="#tour" data-t="nav.tour"></a>
    <a href="#package" data-t="nav.package"></a>
    <a href="#contact" data-t="nav.contact"></a>
  </nav>
  <div class="top-actions">
    <button id="lang" class="pill" data-t="nav.lang"></button>
    <a class="btn btn-primary wa-link" target="_blank" rel="noopener" data-t="nav.cta"></a>
  </div>
</header>

<section id="intro">
  <span class="kicker" data-t="intro.kicker"></span>
  <h1><span data-t="intro.h1a"></span><em data-t="intro.h1b"></em></h1>
  <p data-t="intro.sub"></p>
</section>
<div id="scroll-hint"><span data-t="intro.hint"></span><i></i></div>

<aside id="card" aria-live="polite"></aside>
<nav id="dock"></nav>

<main id="top">
  <section id="tour"></section>

  <section id="package" class="panel">
    <div class="wrap pkg">
      <div class="pkg-copy">
        <span class="kicker" data-t="pkg.kicker"></span>
        <h2 data-t="pkg.h"></h2>
        <p class="muted" data-t="pkg.note"></p>
      </div>
      <div class="price-card">
        <div class="orb" aria-hidden="true"></div>
        <span class="from" data-t="pkg.from"></span>
        <div class="price"><b data-t="pkg.price"></b><small data-t="pkg.cur"></small></div>
        <ul id="pkg-items"></ul>
        <a class="btn btn-mint wa-link" target="_blank" rel="noopener" data-t="pkg.btn"></a>
        <a class="btn btn-line" href="https://web.theplanetco.com/" data-t="pkg.btn2"></a>
      </div>
    </div>
  </section>

  <section id="contact" class="panel">
    <div class="wrap contact">
      <span class="kicker" data-t="contact.kicker"></span>
      <h2 data-t="contact.h"></h2>
      <p class="muted" data-t="contact.p"></p>
      <div class="contact-grid">
        <a class="c-tile wa-link" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>
          <span data-t="contact.wa"></span>
          <b dir="ltr">01203101104</b>
        </a>
        <a class="c-tile mail-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <span data-t="contact.mail"></span>
          <b dir="ltr">info@theplanetco.com</b>
        </a>
      </div>
    </div>
    <footer class="wrap foot">
      <img src="assets/brand/lockup-light.png" alt="Planet Creative Marketing">
      <span data-t="footer"></span>
    </footer>
  </section>
</main>

<div class="no-gl-msg">
  <img src="assets/brand/lockup-light.png" alt="Planet">
</div>

<script type="module" src="assets/js/main.js?v=1"></script>
</body>
</html>
