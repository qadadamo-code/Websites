<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-300-normal.woff2);font-weight:300}
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2);font-weight:400}
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2);font-weight:600}
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:IT;src:url(assets/fonts/inter-tight-latin-300-normal.woff2);font-weight:300}
@font-face{font-family:IT;src:url(assets/fonts/inter-tight-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:IT;src:url(assets/fonts/inter-tight-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IT;src:url(assets/fonts/inter-tight-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:IT;src:url(assets/fonts/inter-tight-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Mono;src:url(assets/fonts/ibm-plex-mono-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Mono;src:url(assets/fonts/ibm-plex-mono-latin-500-normal.woff2);font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0E1520}
body{font-family:IT,Plex,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.ab{position:absolute}
.c{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;white-space:nowrap}
.ar{font-family:Plex,IT,sans-serif;direction:rtl}
.lt{font-family:IT,sans-serif;direction:ltr}
.mono{font-family:Mono,monospace;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.cur{display:inline-block;width:6px;height:.92em;margin:0 6px;vertical-align:-.1em}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:overlay}
</style></head>
<body><div id="stage"></div><div id="grain"></div>
<script src="scene.js"></script>
</body></html>
