<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-300-normal.woff2);font-weight:300;unicode-range:U+0600-06FF,U+FE70-FEFF}
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2);font-weight:400;unicode-range:U+0600-06FF,U+FE70-FEFF}
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2);font-weight:600;unicode-range:U+0600-06FF,U+FE70-FEFF}
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700;unicode-range:U+0600-06FF,U+FE70-FEFF}
@font-face{font-family:Man;src:url(assets/fonts/manrope-latin-300-normal.woff2);font-weight:300}
@font-face{font-family:Man;src:url(assets/fonts/manrope-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Man;src:url(assets/fonts/manrope-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Man;src:url(assets/fonts/manrope-latin-800-normal.woff2);font-weight:800}
:root{--mint:#92C5B4;--navy:#143659;--ink:#0B1D33;--dark:#07111E;--paper:#F2F4F3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{font-family:Man,Plex,sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;display:none}
.center{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;white-space:nowrap}
.cur{display:inline-block;width:.07em;height:1em;background:var(--mint);margin:0 .06em;vertical-align:-.12em;border-radius:2px}
.blk{display:inline-block;height:1.05em;background:rgba(146,197,180,.75);vertical-align:-.16em;margin:0 .02em;mix-blend-mode:multiply}
.gl{position:absolute;height:3px;background:#c9cfcc}
.ar{font-family:Plex;direction:rtl}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:multiply}
/* mosaic */
#mos{position:absolute;left:50%;top:50%;width:1500px;height:2600px;margin:-1300px 0 0 -750px;display:flex;gap:30px;justify-content:center}
.col{display:flex;flex-direction:column;gap:30px;width:340px}
.tile{width:340px;height:736px;border-radius:44px;overflow:hidden;background:#0d2238;box-shadow:0 30px 60px rgba(0,0,0,.35);border:6px solid #0e1c2c;flex:none}
.tile img{width:100%;height:100%;object-fit:cover;object-position:top}
.chip{display:inline-block;opacity:0}
</style></head>
<body><div id="stage">

<!-- S0/S1 hello -->
<div class="scene" id="s1">
  <div id="glines"></div>
  <div class="center ar" id="hello" style="top:820px;height:200px;font-size:170px;font-weight:700"></div>
</div>

<!-- S2-S4 planet -->
<div class="scene" id="s2">
  <svg id="planet" width="1080" height="1920" style="position:absolute;inset:0">
    <defs>
      <radialGradient id="sph" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#2a5a86"/><stop offset=".55" stop-color="#143659"/><stop offset="1" stop-color="#081a2e"/></radialGradient>
      <radialGradient id="sphm" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#d9f0e7"/><stop offset=".5" stop-color="#92C5B4"/><stop offset="1" stop-color="#4f8f7b"/></radialGradient>
    </defs>
    <g id="pg">
      <path id="ringB" fill="none" stroke="#92C5B4" stroke-linecap="round"/>
      <circle id="sphere" fill="url(#sph)"/>
      <path id="ringF" fill="none" stroke="#92C5B4" stroke-linecap="round"/>
    </g>
  </svg>
  <div class="center ar" id="im" style="font-size:150px;font-weight:600;color:#fff"></div>
  <div class="center" id="small" style="font-size:54px"></div>
  <div id="drop" style="position:absolute;width:26px;height:26px;border-radius:50%;background:var(--mint);display:none"></div>
</div>

<!-- S5 window -->
<div class="scene" id="s5" style="background:var(--dark)">
  <div id="win" style="position:absolute;left:50%;top:50%;width:880px;height:600px;background:var(--paper);border-radius:40px;overflow:hidden;transform-origin:50% 50%">
    <div id="wbar" style="position:absolute;left:0;right:0;top:0;height:64px;display:flex;gap:14px;align-items:center;padding:0 30px;direction:ltr">
      <i style="width:16px;height:16px;border-radius:50%;background:#e66"></i><i style="width:16px;height:16px;border-radius:50%;background:#e8c35a"></i><i style="width:16px;height:16px;border-radius:50%;background:var(--mint)"></i>
      <span style="margin-left:24px;flex:1;height:30px;border-radius:15px;background:#e2e7e5;font:500 18px Man;color:#6b7b77;display:flex;align-items:center;padding:0 18px">theplanetco.com</span>
    </div>
    <svg id="iris" width="880" height="600" style="position:absolute;inset:0">
      <defs><radialGradient id="sphm2" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#d9f0e7"/><stop offset=".5" stop-color="#92C5B4"/><stop offset="1" stop-color="#4f8f7b"/></radialGradient></defs>
      <g id="ig">
        <path id="iRingB" fill="none" stroke="#143659" stroke-width="16" stroke-linecap="round"/>
        <circle id="isph" r="190" fill="url(#sphm2)"/>
        <path id="iRingF" fill="none" stroke="#143659" stroke-width="16" stroke-linecap="round"/>
        <circle id="ihl" r="22" fill="#fff"/>
      </g>
    </svg>
    <div class="center ar" id="wtxt" style="top:0;bottom:0;font-size:70px;font-weight:300;color:var(--ink)"></div>
  </div>
</div>

<!-- S6 typing roles -->
<div class="scene" id="s6">
  <div class="center ar" id="roles" style="top:880px;height:160px;font-size:88px"></div>
</div>

<!-- S7/S8 name + mosaic -->
<div class="scene" id="s7">
  <div class="center" id="nm" style="top:900px;height:120px;font-size:56px"></div>
  <div id="ndot" style="position:absolute;border-radius:50%;background:var(--mint);overflow:hidden">
    <div id="mwrap" style="position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px">
      <div id="mos"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,17,30,.25) 0%,rgba(7,17,30,0) 30%,rgba(7,17,30,.15) 50%,rgba(7,17,30,.92) 76%,#07111E 100%)"></div>
      <div id="card" style="position:absolute;left:0;right:0;top:1460px;text-align:center;color:#fff">
        <div style="font-size:92px;display:flex;justify-content:center;gap:26px;align-items:baseline"><span style="font-family:Man;font-weight:800">Planet</span><span class="ar" style="font-weight:300">بلانت</span></div>
        <div id="chips" class="ar" style="margin-top:22px;font-size:38px;font-weight:400;color:#cfe3dc"></div>
      </div>
    </div>
  </div>
  <div id="fade" style="position:absolute;inset:0;background:var(--dark);opacity:0"></div>
</div>

<!-- S9 end -->
<div class="scene" id="s9" style="background:var(--dark)">
  <img id="logo" src="assets/p.svg" style="position:absolute;left:50%;top:700px;width:150px;margin-left:-75px;filter:invert(83%) sepia(12%) saturate(640%) hue-rotate(108deg) brightness(92%)">
  <div class="center" id="endw" style="top:930px;height:100px;font-size:58px;color:#fff;letter-spacing:.42em;direction:ltr"></div>
  <div class="center" id="end2" style="top:1060px;height:60px;font:500 34px Man;color:#8ea4b5;letter-spacing:.06em;direction:ltr"></div>
  <div class="center ar" id="end3" style="gap:14px;top:1130px;height:60px;font-size:34px;color:#8ea4b5;font-weight:400"></div>
</div>

<div id="grain"></div>
<div style="position:absolute;left:-9999px;top:0"><span class="ar" style="font-weight:300">بلانت</span><span class="ar" style="font-weight:400">بلانت</span><span class="ar" style="font-weight:600">بلانت</span><span class="ar" style="font-weight:700">بلانت</span><span style="font-family:Man;font-weight:300">Pa</span><span style="font-family:Man;font-weight:500">Pa</span><span style="font-family:Man;font-weight:700">Pa</span><span style="font-family:Man;font-weight:800">Pa</span></div>
</div>
<script src="scene.js"></script>
</body></html>
