<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>

</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
const W = 1080, H = 1920;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 100); cam.position.set(0, 0.9, 11.5); cam.lookAt(0, 0.95, 0);
// backdrop: studio grey with radial falloff
const cv = document.createElement('canvas'); cv.width = 512; cv.height = 1024; const g = cv.getContext('2d');
const gr = g.createRadialGradient(256, 380, 20, 256, 420, 620); gr.addColorStop(0, '#dfe4e3'); gr.addColorStop(0.35, '#b9c2c1'); gr.addColorStop(1, '#4c585b');
g.fillStyle = gr; g.fillRect(0, 0, 512, 1024);
const bt = new THREE.CanvasTexture(cv); bt.colorSpace = THREE.SRGBColorSpace;
const back = new THREE.Mesh(new THREE.PlaneGeometry(14, 28), new THREE.MeshBasicMaterial({ map: bt, toneMapped: false })); back.position.set(0, 1.0, -6); scene.add(back);
// ring light
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.75, 0.09, 32, 200), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false })); ring.position.set(0, 1.55, -2.6); scene.add(ring);
// glow around ring
const gc = document.createElement('canvas'); gc.width = gc.height = 512; const gg = gc.getContext('2d');
const rg = gg.createRadialGradient(256, 256, 150, 256, 256, 256); rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(0.42, 'rgba(255,255,255,.55)'); rg.addColorStop(0.5, 'rgba(255,255,255,.9)'); rg.addColorStop(0.6, 'rgba(255,255,255,.35)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
gg.fillStyle = rg; gg.fillRect(0, 0, 512, 512);
const glow = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gc), transparent: true, depthWrite: false, toneMapped: false })); glow.position.copy(ring.position); glow.position.z -= 0.05; // glow disabled
// light stands (soft dark verticals like the studio photo)
for (const x of [-3.6, 3.7]) { const s = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 9, 12), new THREE.MeshStandardMaterial({ color: 0x2a2f33, roughness: .6 })); s.position.set(x, 0, -4.5); scene.add(s); const h = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.3), new THREE.MeshStandardMaterial({ color: 0x1d2226 })); h.position.set(x, 3.1, -4.5); scene.add(h); }
// lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x6d7d86, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 8); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight(0xdff6ee, 3.0); rim.position.set(-4, 3, -4); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xffffff, 2.0); rim2.position.set(4, 2, -4); scene.add(rim2);
// P logo
const txt = await (await fetch('assets/p.svg')).text();
const data = new SVGLoader().parse(txt); const shapes = []; data.paths.forEach((p) => SVGLoader.createShapes(p).forEach((s) => shapes.push(s)));
const geo = new THREE.ExtrudeGeometry(shapes, { depth: 90, bevelEnabled: true, bevelThickness: 18, bevelSize: 10, bevelOffset: -4, bevelSegments: 8, curveSegments: 40 });
geo.computeBoundingBox(); const bb = geo.boundingBox; geo.translate(-(bb.min.x + bb.max.x) / 2, -(bb.min.y + bb.max.y) / 2, -(bb.min.z + bb.max.z) / 2);
const s = 1.75 / (bb.max.y - bb.min.y);
const navy = new THREE.MeshPhysicalMaterial({ color: 0x143659, metalness: 0.15, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.08 });
const P = new THREE.Mesh(geo, navy); P.scale.set(s, -s, s); P.rotation.y = -0.32; P.position.set(0.05, 1.45, 0); P.castShadow = true; scene.add(P);
// mint dot (brand)
const dot = new THREE.Mesh(new THREE.SphereGeometry(0.2, 64, 64), new THREE.MeshPhysicalMaterial({ color: 0x92c5b4, roughness: 0.18, clearcoat: 1 })); dot.position.set(0.62, 0.42, 0.35); dot.castShadow = true; scene.add(dot);
// floor catching shadow
const fl = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.18 })); fl.rotation.x = -Math.PI / 2; fl.position.y = 0.45; fl.receiveShadow = true; scene.add(fl);
r.render(scene, cam);
window.done = true;
</script></body></html>
