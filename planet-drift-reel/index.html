// ================= SCENE A (0 – 5.1) =================
const layer = mk(), lc = layer.getContext('2d');
let w1, w2a, w2b, w2c, w2;

const CY = 960;

function sceneText(t) {

// strips
const SW = 230;

  const cb0 = 4.42, cb1 = 5.02;

// ================= SCENE B (5.1 – end) =================

const acc = mk(), ac = acc.getContext('2d');
