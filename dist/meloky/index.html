<!doctype html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الملوكي للأثاث والمفروشات | Meloky Furniture</title>
<meta name="description" content="Meloky Furniture — الملوكي للأثاث والمفروشات: تصنيع وتصدير الأثاث المنزلي من مصانعنا في دمياط، تفصيل على المقاس لكل عميل.">
<meta name="theme-color" content="#120d09">
<meta property="og:title" content="Meloky Furniture | الملوكي للأثاث والمفروشات">
<meta property="og:description" content="تصنيع وتصدير الأثاث المنزلي، تفصيل على المقاس من دمياط إلى بيتك.">
<meta property="og:image" content="https://web.theplanetco.com/meloky/assets/img/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="assets/img/icon.png">
<link rel="apple-touch-icon" href="assets/img/icon.png">
<link rel="preload" href="assets/fonts/IBMPlexSansArabic-400n-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/InterTight-300_700n-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/seq/f001.webp" as="image">
<link rel="stylesheet" href="assets/css/fonts.css?v=1">
<link rel="stylesheet" href="assets/css/style.css?v=1">
<script>(function(){try{var t=localStorage.getItem('ml-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
</head>
<body>

<!-- ============ INTRO ============ -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro__stage">
    <svg class="intro__logo" id="introLogo" viewBox="140 80 1720 1110"></svg>
    <p class="intro__tag">ELEGANCE · QUALITY · DISTINCTION</p>
  </div>
  <button class="intro__skip" id="introSkip" data-i18n="intro.skip">تخطي</button>
</div>

<!-- ============ HEADER ============ -->
<header class="hdr" id="hdr">
  <a class="hdr__brand" href="#top" aria-label="Meloky Furniture">
    <svg class="hdr__mark" data-logo="mark" viewBox="780 100 440 740"></svg>
    <span class="hdr__txt">
      <svg class="hdr__word" data-logo="word" viewBox="170 840 1660 260"></svg>
      <small data-i18n="brand.sub">للأثاث والمفروشات</small>
    </span>
  </a>
  <nav class="hdr__nav" aria-label="main">
    <a href="#collections" data-i18n="nav.collections"></a>
    <a href="#measure" data-i18n="nav.measure"></a>
    <a href="#showroom" data-i18n="nav.showroom"></a>
    <a href="#craft" data-i18n="nav.craft"></a>
    <a href="#export" data-i18n="nav.export"></a>
    <a href="#visit" data-i18n="nav.visit"></a>
  </nav>
  <div class="hdr__tools">
    <div class="lang" id="lang">
      <button class="lang__btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <span id="langShort">AR</span>
      </button>
      <ul class="lang__menu" id="langMenu" role="listbox"></ul>
    </div>
    <button class="theme" id="themeBtn" aria-label="day / night">
      <span class="theme__knob"></span>
      <svg class="theme__moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      <svg class="theme__sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
    </button>
    <button class="listbtn" id="listBtn" aria-label="my list">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/></svg>
      <b id="listCount">0</b>
    </button>
    <a class="btn btn--gold btn--sm hdr__wa" data-wa href="#"><span data-i18n="cta.whatsapp">واتساب</span></a>
    <button class="burger" id="burger" aria-label="menu"><span></span><span></span></button>
  </div>
</header>

<div class="mnav" id="mnav">
  <nav>
    <a href="#collections" data-i18n="nav.collections"></a>
    <a href="#measure" data-i18n="nav.measure"></a>
    <a href="#showroom" data-i18n="nav.showroom"></a>
    <a href="#craft" data-i18n="nav.craft"></a>
    <a href="#export" data-i18n="nav.export"></a>
    <a href="#visit" data-i18n="nav.visit"></a>
  </nav>
  <div class="mnav__langs" id="mnavLangs"></div>
  <a class="btn btn--gold" data-wa href="#"><span data-i18n="cta.whatsapp"></span></a>
</div>

<main id="top">

<!-- ============ HERO ============ -->
<section class="hero" id="hero">
  <div class="hero__pin">
    <canvas class="hero__canvas" id="heroCanvas"></canvas>
    <div class="hero__shade"></div>
    <div class="hero__frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="hero__copy">
      <p class="kicker"><span class="kicker__dot"></span><span data-i18n="hero.kicker"></span></p>
      <div class="hero__steps">
        <div class="hero__step is-on" data-step="0">
          <h1 data-i18n="hero.s1.t"></h1>
          <p data-i18n="hero.s1.p"></p>
        </div>
        <div class="hero__step" data-step="1">
          <h2 data-i18n="hero.s2.t"></h2>
          <p data-i18n="hero.s2.p"></p>
        </div>
        <div class="hero__step" data-step="2">
          <h2 data-i18n="hero.s3.t"></h2>
          <p data-i18n="hero.s3.p"></p>
          <div class="hero__ctas">
            <a class="btn btn--gold" href="#collections" data-i18n="hero.cta1"></a>
            <a class="btn btn--ghost" href="#measure" data-i18n="hero.cta2"></a>
          </div>
        </div>
      </div>
    </div>
    <div class="hero__stamp" aria-hidden="true">
      <span class="hero__place" id="heroPlace" data-i18n="hero.from"></span>
      <span class="hero__bar"><i id="heroBar"></i></span>
      <span class="hero__place" data-i18n="hero.to"></span>
    </div>
    <div class="hero__hint"><span class="hero__mouse"></span><span data-i18n="hero.scroll"></span></div>
  </div>
</section>

<!-- ============ MARQUEE ============ -->
<div class="marq" aria-hidden="true"><div class="marq__track" id="marq"></div></div>

<!-- ============ PILLARS ============ -->
<section class="pillars">
  <div class="wrap">
    <p class="statement" id="statement"></p>
    <div class="pillars__grid">
      <div class="pillar rv"><span class="pillar__ico"><svg viewBox="0 0 48 48"><path d="M6 40V20l10 6V20l10 6V12l16 8v20z"/><path d="M6 40h36M14 33h4M24 33h4M34 33h4"/></svg></span><h3 data-i18n="pil.1.t"></h3><p data-i18n="pil.1.p"></p></div>
      <div class="pillar rv"><span class="pillar__ico"><svg viewBox="0 0 48 48"><path d="M6 34h36v6H6z"/><path d="M10 34v-3M14 34v-5M18 34v-3M22 34v-5M26 34v-3M30 34v-5M34 34v-3M38 34v-5"/><path d="M14 22l10-14 10 14"/></svg></span><h3 data-i18n="pil.2.t"></h3><p data-i18n="pil.2.p"></p></div>
      <div class="pillar rv"><span class="pillar__ico"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><path d="M7 24h34M24 7c5 5 7 10.6 7 17s-2 12-7 17c-5-5-7-10.6-7-17s2-12 7-17z"/></svg></span><h3 data-i18n="pil.3.t"></h3><p data-i18n="pil.3.p"></p></div>
      <div class="pillar pillar--num rv"><b class="num" data-count="26">0</b><span class="num">K+</span><h3 data-i18n="pil.4.t"></h3><p data-i18n="pil.4.p"></p></div>
    </div>
  </div>
</section>

<!-- ============ COLLECTIONS ============ -->
<section class="cols" id="collections">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <p class="kicker"><span class="kicker__dot"></span><span data-i18n="col.kicker"></span></p>
        <h2 class="h2" data-i18n="col.title"></h2>
      </div>
      <p class="lead" data-i18n="col.p"></p>
    </div>
    <div class="accord" id="accord"></div>
  </div>
</section>

<!-- ============ MEASURE / CONFIGURATOR ============ -->
<section class="measure" id="measure">
  <div class="wrap measure__wrap">
    <div class="measure__info">
      <p class="kicker"><span class="kicker__dot"></span><span data-i18n="ms.kicker"></span></p>
      <h2 class="h2" data-i18n="ms.title"></h2>
      <p class="lead" data-i18n="ms.p"></p>

      <div class="ctl">
        <label class="ctl__lbl" data-i18n="ms.type"></label>
        <div class="seg" id="msType"></div>
      </div>
      <div class="ctl">
        <label class="ctl__lbl"><span data-i18n="ms.width"></span> <b class="num" id="msWv">160</b> <span data-i18n="ms.cm"></span></label>
        <input type="range" id="msW" min="100" max="260" step="10" value="160">
      </div>
      <div class="ctl">
        <label class="ctl__lbl"><span data-i18n="ms.height"></span> <b class="num" id="msHv">90</b> <span data-i18n="ms.cm"></span></label>
        <input type="range" id="msH" min="70" max="240" step="5" value="90">
      </div>
      <div class="ctl ctl--row">
        <div>
          <label class="ctl__lbl" data-i18n="ms.finish"></label>
          <div class="swatches" id="msFinish"></div>
        </div>
        <div>
          <label class="ctl__lbl" data-i18n="ms.handle"></label>
          <div class="swatches" id="msHandle"></div>
        </div>
      </div>
    </div>
    <div class="measure__stage">
      <div class="bp" id="bp">
        <div class="bp__top"><span class="num" id="bpRef">ML-160-90</span><span data-i18n="ms.drawing"></span></div>
        <svg id="bpSvg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="bp__foot">
          <div><small data-i18n="ms.est"></small><b><span class="num" id="bpPrice">0</span> <span data-i18n="shop.currency"></span></b></div>
          <div><small data-i18n="ms.days"></small><b class="num" id="bpDays">21–30</b></div>
          <a class="btn btn--gold" id="bpSend" href="#"><span data-i18n="ms.send"></span></a>
        </div>
      </div>
      <p class="note" data-i18n="ms.note"></p>
    </div>
  </div>
</section>

<!-- ============ SHOWROOM ============ -->
<section class="shop" id="showroom">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <p class="kicker"><span class="kicker__dot"></span><span data-i18n="shop.kicker"></span></p>
        <h2 class="h2" data-i18n="shop.title"></h2>
      </div>
      <p class="lead" data-i18n="shop.p"></p>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<!-- ============ CRAFT ============ -->
<section class="craft" id="craft">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <p class="kicker"><span class="kicker__dot"></span><span data-i18n="craft.kicker"></span></p>
        <h2 class="h2" data-i18n="craft.title"></h2>
      </div>
      <p class="lead" data-i18n="craft.p"></p>
    </div>
    <ol class="steps" id="steps"></ol>
  </div>
</section>

<!-- ============ EXPORT ============ -->
<section class="export" id="export">
  <div class="export__bg"><img src="assets/img/export.webp" alt="" loading="lazy"></div>
  <div class="wrap export__wrap">
    <div class="export__info">
      <p class="kicker"><span class="kicker__dot"></span><span data-i18n="ex.kicker"></span></p>
      <h2 class="h2" data-i18n="ex.title"></h2>
      <p class="lead" data-i18n="ex.p"></p>
      <ul class="ticks">
        <li data-i18n="ex.l1"></li><li data-i18n="ex.l2"></li><li data-i18n="ex.l3"></li><li data-i18n="ex.l4"></li>
      </ul>
    </div>
    <form class="form" id="exForm" novalidate>
      <h3 data-i18n="ex.form"></h3>
      <label><span data-i18n="ex.company"></span><input name="company" autocomplete="organization"></label>
      <label><span data-i18n="ex.country"></span><input name="country" autocomplete="country-name"></label>
      <label><span data-i18n="ex.items"></span><select name="items" id="exItems"></select></label>
      <label><span data-i18n="ex.qty"></span><input name="qty" inputmode="numeric"></label>
      <label class="full"><span data-i18n="ex.notes"></span><textarea name="notes" rows="3"></textarea></label>
      <button class="btn btn--gold full" type="submit"><span data-i18n="ex.send"></span></button>
    </form>
  </div>
</section>

<!-- ============ VISIT ============ -->
<section class="visit" id="visit">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <p class="kicker"><span class="kicker__dot"></span><span data-i18n="visit.kicker"></span></p>
        <h2 class="h2" data-i18n="visit.title"></h2>
      </div>
    </div>
    <div class="visit__grid">
      <article class="vcard vcard--img rv"><img src="assets/img/showroom.webp" alt="" loading="lazy"><div class="vcard__body"><span class="tag" data-i18n="visit.s.tag"></span><h3 data-i18n="visit.s.t"></h3><p data-i18n="visit.s.p"></p><a class="link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Giza+Egypt"><span data-i18n="visit.map"></span> ↗</a></div></article>
      <article class="vcard rv"><span class="tag" data-i18n="visit.f.tag"></span><h3 data-i18n="visit.f.t"></h3><p data-i18n="visit.f.p"></p>
        <dl class="hours"><div><dt data-i18n="visit.days"></dt><dd class="num">11:00 – 23:00</dd></div><div><dt data-i18n="visit.fri"></dt><dd class="num">14:00 – 23:00</dd></div></dl>
        <div class="vcard__ctas"><a class="btn btn--gold" data-wa href="#"><span data-i18n="cta.whatsapp"></span></a><a class="btn btn--ghost" data-tel href="#"><span class="num" data-phone></span></a></div>
      </article>
    </div>
  </div>
</section>

</main>

<footer class="foot">
  <div class="wrap foot__wrap">
    <div class="foot__brand">
      <svg class="foot__logo" data-logo="full" viewBox="140 80 1720 1110"></svg>
      <p data-i18n="foot.p"></p>
    </div>
    <div class="foot__cols">
      <div><h4 data-i18n="foot.explore"></h4><a href="#collections" data-i18n="nav.collections"></a><a href="#measure" data-i18n="nav.measure"></a><a href="#showroom" data-i18n="nav.showroom"></a><a href="#export" data-i18n="nav.export"></a></div>
      <div><h4 data-i18n="foot.contact"></h4><a data-wa href="#"><span data-i18n="cta.whatsapp"></span></a><a data-tel href="#"><span class="num" data-phone></span></a><a href="https://www.facebook.com/ElmelokyFurniture" target="_blank" rel="noopener">Facebook</a><a href="https://www.instagram.com/elmelokyfurniture" target="_blank" rel="noopener">Instagram</a></div>
    </div>
  </div>
  <div class="wrap foot__bottom">
    <span>© <span class="num">2026</span> Meloky Furniture</span>
    <a href="https://web.theplanetco.com" target="_blank" rel="noopener" class="credit"><span data-i18n="foot.credit"></span> Planet Creative Marketing</a>
  </div>
</footer>

<!-- bottom bar (mobile) -->
<div class="bbar">
  <a href="#measure" class="bbar__b"><svg viewBox="0 0 24 24"><path d="M3 17h18v4H3zM6 17v-2M9 17v-3M12 17v-2M15 17v-3M18 17v-2"/></svg><span data-i18n="cta.measure"></span></a>
  <a data-tel href="#" class="bbar__b"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><span data-i18n="cta.call"></span></a>
  <a data-wa href="#" class="bbar__b bbar__b--gold"><svg viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8.5 8.5 0 1 1 8 19z"/></svg><span data-i18n="cta.whatsapp"></span></a>
</div>

<!-- drawer -->
<div class="drawer" id="drawer" aria-hidden="true">
  <aside class="drawer__panel">
    <div class="drawer__head"><h3 data-i18n="list.title"></h3><button class="x" id="drawerX" aria-label="close">×</button></div>
    <div class="drawer__body" id="drawerBody"></div>
    <a class="btn btn--gold" id="drawerSend" href="#"><span data-i18n="list.send"></span></a>
  </aside>
</div>

<!-- modal -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__box">
    <button class="x modal__x" id="modalX" aria-label="close">×</button>
    <div class="modal__img"><img id="modalImg" alt=""></div>
    <div class="modal__body">
      <span class="card__cat" id="modalCat"></span>
      <h3 id="modalName"></h3>
      <p id="modalDesc"></p>
      <p class="modal__price" id="modalPrice"></p>
      <ul class="modal__specs" id="modalSpecs"></ul>
      <div class="modal__ctas"><button class="btn btn--ghost" id="modalAdd"></button><a class="btn btn--gold" id="modalWa" target="_blank" rel="noopener" href="#"><span data-i18n="shop.ask"></span></a></div>
    </div>
  </div>
</div>

<script src="assets/js/vendor/gsap.min.js"></script>
<script src="assets/js/vendor/ScrollTrigger.min.js"></script>
<script src="assets/js/vendor/lenis.min.js"></script>
<script src="assets/js/logo-data.js?v=1"></script>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/data.js?v=1"></script>
<script src="assets/js/app.js?v=1"></script>
</body>
</html>
