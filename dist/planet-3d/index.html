<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بلانت | Planet Creative Marketing</title>
<meta name="description" content="بلانت للتسويق الإبداعي: مواقع، إعلانات، محتوى وهوية. بنبني عوالم للبراندات.">
<meta name="theme-color" content="#a9b4bf">
<meta property="og:title" content="Planet | بلانت">
<meta property="og:description" content="بنبني عوالم للبراندات: مواقع، إعلانات، محتوى وهوية.">
<link rel="icon" href="assets/brand/mark-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=10">
<script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.min.js", "three/addons/": "./assets/vendor/addons/" } }</script>
</head>
<body data-ch="hero">

<div id="loader">
  <div class="l-line"><i></i></div>
  <div class="l-meta"><span class="l-txt"></span><span class="l-pct mono">000</span></div>
</div>

<canvas id="gl" aria-hidden="true"></canvas>
<svg id="hud-lines" aria-hidden="true"></svg>
<div id="hud-nums" aria-hidden="true"></div>
<div id="tags" aria-hidden="true"><span class="tag-float mono"></span><span class="tag-float mono"></span><span class="tag-float mono"></span></div>
<div id="bgwords" aria-hidden="true"><span>WEB</span><span>ADS</span><span>CONTENT</span><span>BRAND</span><span>SYSTEMS</span><span>PLANET</span></div>
<div id="cursor" aria-hidden="true"></div>

<!-- corners, like a HUD -->
<header class="corner c-start">
  <a href="#" class="logo" aria-label="Planet" onclick="scrollTo({top:0,behavior:'smooth'});return false">
    <img src="assets/brand/mark-light.png" alt=""><b>PLANET</b>
  </a>
  <p class="mono small" data-t="copy"></p>
  <p class="small" data-t="company"></p>
</header>
<div class="corner c-end">
  <div class="top-ctl">
    <button id="lang" class="mono small" data-t="lang" data-hover></button>
    <button id="menu-btn" class="mono small"><i></i><span data-t="menu"></span></button>
  </div>
  <div class="mission-box">
    <p class="mono small" data-t="manifestoTag"></p>
    <p id="mission" class="small"></p>
  </div>
</div>
<div class="corner c-bottom">
  <p id="scroll-hint" class="small"><span data-t="scroll"></span></p>
  <button id="sound" class="mono small"><i><b></b><b></b><b></b><b></b></i><span></span></button>
</div>
<nav id="chapters" aria-label="sections"></nav>
<div id="progress"><b></b></div>

<!-- chapter 0: hero title -->
<section id="hero" aria-label="Planet">
  <p class="mono kicker" data-t="hero.kicker"></p>
  <h1 id="hero-h"></h1>
  <p class="mono small hint" data-t="hero.hint"></p>
</section>

<!-- chapters 1-2: side panel -->
<aside id="panel"></aside>

<!-- chapter 3 -->
<section id="manifesto"></section>

<!-- chapter 4 -->
<section id="contact">
  <div class="c-card">
    <h2 id="contact-h"></h2>
    <p class="sub" data-t="contact.sub"></p>
    <div class="price"><span class="from" data-t="contact.from"></span><b data-t="contact.price"></b><small data-t="contact.cur"></small></div>
    <ul id="inc"></ul>
    <p class="note" data-t="contact.note"></p>
    <a class="cta wa-link" target="_blank" rel="noopener"><span data-t="contact.cta"></span><i>↗</i></a>
  </div>
  <nav id="links"></nav>
</section>

<!-- full-screen menu -->
<div id="menu" aria-hidden="true">
  <div class="m-inner">
    <nav id="menu-links"></nav>
    <div class="m-side">
      <p class="mono small" data-t="faqTitle"></p>
      <div id="faq"></div>
      <div class="m-contact">
        <a class="wa-link" target="_blank" rel="noopener" dir="ltr">+20 120 310 1104</a>
        <a class="mail-link" dir="ltr">info@theplanetco.com</a>
      </div>
    </div>
  </div>
</div>

<main id="track"></main>
<div class="no-gl-msg"><img src="assets/brand/lockup-light.png" alt="Planet"></div>

<script type="module" src="assets/js/main.js?v=10"></script>
</body>
</html>
