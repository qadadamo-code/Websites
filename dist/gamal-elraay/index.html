<!doctype html>
<html lang="ar" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جمال الراعي للأثاث | Gamal Elraay Furniture</title>
<meta name="description" content="Gamal Elraay Furniture — أثاث عصري فاخر: انتريهات، ركنات، غرف نوم وسفرة، تفصيل على المقاس بلمسة ذهب.">
<meta name="theme-color" content="#0b0a08">
<meta property="og:title" content="Gamal Elraay Furniture | جمال الراعي للأثاث">
<meta property="og:description" content="أثاث عصري فاخر، تفصيل على المقاس بلمسة ذهب.">
<meta property="og:image" content="https://web.theplanetco.com/gamal-elraay/assets/img/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="assets/img/icon.png">
<link rel="apple-touch-icon" href="assets/img/icon.png">
<link rel="preload" href="assets/fonts/IBMPlexSansArabic-400n-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/InterTight-300_700n-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/seq/f001.webp" as="image">
<link rel="stylesheet" href="assets/css/fonts.css?v=1">
<link rel="stylesheet" href="assets/css/style.css?v=2">
<script>
(function(){try{var t=localStorage.getItem('gr-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
</head>
<body>

<!-- ============ INTRO ============ -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro__stage">
    <svg class="intro__mark" id="introMark" viewBox="210 530 540 320"></svg>
    <svg class="intro__word" id="introWord" viewBox="60 368 820 160"></svg>
  </div>
  <button class="intro__skip" id="introSkip" data-i18n="intro.skip">تخطي</button>
</div>

<!-- ============ HEADER ============ -->
<header class="hdr" id="hdr">
  <a class="hdr__brand" href="#top" aria-label="Gamal Elraay Furniture">
    <svg class="hdr__mark" data-logo="mark" viewBox="210 530 540 320"></svg>
    <span class="hdr__name">
      <svg class="hdr__word" data-logo="word" viewBox="60 368 820 110"></svg>
    </span>
  </a>
  <nav class="hdr__nav" aria-label="main">
    <a href="#collections" data-i18n="nav.collections">المجموعات</a>
    <a href="#studio" data-i18n="nav.studio">استوديو الأقمشة</a>
    <a href="#showroom" data-i18n="nav.showroom">المعرض</a>
    <a href="#craft" data-i18n="nav.craft">الصنعة</a>
    <a href="#tailor" data-i18n="nav.tailor">فصّل قطعتك</a>
    <a href="#visit" data-i18n="nav.visit">زورنا</a>
  </nav>
  <div class="hdr__tools">
    <div class="lang" id="lang">
      <button class="lang__btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <span id="langShort">AR</span>
      </button>
      <ul class="lang__menu" id="langMenu" role="listbox"></ul>
    </div>
    <button class="theme" id="themeBtn" aria-label="day / night">
      <span class="theme__knob"></span>
      <svg class="theme__moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      <svg class="theme__sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
    </button>
    <button class="listbtn" id="listBtn" aria-label="my list">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/></svg>
      <b id="listCount">0</b>
    </button>
    <a class="btn btn--gold btn--sm hdr__wa" data-wa href="#"><span data-i18n="cta.whatsapp">واتساب</span></a>
    <button class="burger" id="burger" aria-label="menu"><span></span><span></span></button>
  </div>
</header>

<div class="mnav" id="mnav">
  <nav>
    <a href="#collections" data-i18n="nav.collections">المجموعات</a>
    <a href="#studio" data-i18n="nav.studio">استوديو الأقمشة</a>
    <a href="#showroom" data-i18n="nav.showroom">المعرض</a>
    <a href="#craft" data-i18n="nav.craft">الصنعة</a>
    <a href="#tailor" data-i18n="nav.tailor">فصّل قطعتك</a>
    <a href="#visit" data-i18n="nav.visit">زورنا</a>
  </nav>
  <div class="mnav__langs" id="mnavLangs"></div>
</div>

<main id="top">

<!-- ============ HERO ============ -->
<section class="hero" id="hero">
  <div class="hero__pin">
    <canvas class="hero__canvas" id="heroCanvas"></canvas>
    <div class="hero__shade"></div>
    <div class="hero__grid" aria-hidden="true"></div>
    <div class="hero__copy">
      <p class="kicker"><span class="kicker__line"></span><span data-i18n="hero.kicker">جمال الراعي للأثاث</span></p>
      <div class="hero__steps">
        <div class="hero__step is-on" data-step="0">
          <h1 data-i18n="hero.s1.t">كل قطعة تبدأ بخط ذهبي.</h1>
          <p data-i18n="hero.s1.p"></p>
        </div>
        <div class="hero__step" data-step="1">
          <h2 data-i18n="hero.s2.t"></h2>
          <p data-i18n="hero.s2.p"></p>
        </div>
        <div class="hero__step" data-step="2">
          <h2 data-i18n="hero.s3.t"></h2>
          <p data-i18n="hero.s3.p"></p>
          <div class="hero__ctas">
            <a class="btn btn--gold" href="#collections" data-i18n="hero.cta1"></a>
            <a class="btn btn--ghost" href="#tailor" data-i18n="hero.cta2"></a>
          </div>
        </div>
      </div>
    </div>
    <div class="hero__meter"><span id="heroBar"></span></div>
    <div class="hero__hint"><span class="hero__mouse"></span><span data-i18n="hero.scroll"></span></div>
  </div>
</section>

<!-- ============ MARQUEE ============ -->
<div class="marq" aria-hidden="true"><div class="marq__track" id="marq"></div></div>

<!-- ============ STATEMENT ============ -->
<section class="statement">
  <svg class="statement__mark" data-logo="mark" viewBox="210 530 540 320"></svg>
  <p class="statement__text" id="statement" data-i18n-words="statement"></p>
</section>

<!-- ============ COLLECTIONS ============ -->
<section class="cols" id="collections">
  <div class="cols__pin">
    <div class="cols__head">
      <p class="kicker"><span class="kicker__line"></span><span data-i18n="col.kicker"></span></p>
      <h2 class="h2" data-i18n="col.title"></h2>
      <a class="link" data-wa-msg="col.more" href="#"><span data-i18n="col.more"></span> <i>↗</i></a>
    </div>
    <div class="cols__track" id="colsTrack"></div>
    <div class="cols__dots" id="colsDots"></div>
  </div>
</section>

<!-- ============ FABRIC STUDIO ============ -->
<section class="studio" id="studio">
  <div class="wrap studio__wrap">
    <div class="studio__info">
      <p class="kicker"><span class="kicker__line"></span><span data-i18n="studio.kicker"></span></p>
      <h2 class="h2" data-i18n="studio.title"></h2>
      <p class="lead" data-i18n="studio.p"></p>
      <div class="swatches" id="swatches" role="radiogroup"></div>
      <p class="studio__name"><span id="fabName"></span></p>
      <a class="btn btn--gold" id="fabCta" href="#"><span data-i18n="studio.cta"></span></a>
    </div>
    <div class="studio__stage" id="studioStage">
      <img class="studio__img is-on" id="fabA" src="assets/img/hero_end.webp" alt="" loading="lazy">
      <img class="studio__img" id="fabB" alt="" loading="lazy">
      <div class="studio__wipe" id="fabWipe"></div>
      <span class="studio__corner studio__corner--tl"></span><span class="studio__corner studio__corner--br"></span>
    </div>
  </div>
</section>

<!-- ============ SHOWROOM ============ -->
<section class="shop" id="showroom">
  <div class="wrap">
    <div class="shop__head">
      <div>
        <p class="kicker"><span class="kicker__line"></span><span data-i18n="shop.kicker"></span></p>
        <h2 class="h2" data-i18n="shop.title"></h2>
        <p class="muted" data-i18n="shop.p"></p>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<!-- ============ CRAFT ============ -->
<section class="craft" id="craft">
  <div class="wrap craft__wrap">
    <div class="craft__media" id="craftMedia"></div>
    <div class="craft__steps">
      <p class="kicker"><span class="kicker__line"></span><span data-i18n="craft.kicker"></span></p>
      <h2 class="h2" data-i18n="craft.title"></h2>
      <ol id="craftList"></ol>
    </div>
  </div>
  <div class="wrap promises">
    <div class="promise"><svg viewBox="0 0 32 32"><path d="M4 22h24M6 22V12m20 10V12M6 12h20M10 12V8h12v4"/><path d="M4 26h24"/></svg><span data-i18n="promise.1"></span></div>
    <div class="promise"><svg viewBox="0 0 32 32"><circle cx="11" cy="12" r="5"/><circle cx="21" cy="12" r="5"/><circle cx="16" cy="20" r="5"/></svg><span data-i18n="promise.2"></span></div>
    <div class="promise"><svg viewBox="0 0 32 32"><path d="M16 4l10 4v7c0 6.5-4.3 11-10 13-5.7-2-10-6.5-10-13V8z"/><path d="M11.5 16l3 3 6-6"/></svg><span data-i18n="promise.3"></span></div>
    <div class="promise"><svg viewBox="0 0 32 32"><path d="M3 9h16v13H3zM19 13h5l5 5v4H19z"/><circle cx="8" cy="24" r="2.5"/><circle cx="23" cy="24" r="2.5"/></svg><span data-i18n="promise.4"></span></div>
  </div>
</section>

<!-- ============ TAILOR ============ -->
<section class="tailor" id="tailor">
  <div class="wrap tailor__wrap">
    <div class="tailor__intro">
      <p class="kicker"><span class="kicker__line"></span><span data-i18n="tailor.kicker"></span></p>
      <h2 class="h2" data-i18n="tailor.title"></h2>
      <p class="lead" data-i18n="tailor.p"></p>
      <div class="ticket" id="ticket">
        <div class="ticket__head"><svg data-logo="mark" viewBox="210 530 540 320"></svg><b data-i18n="tailor.summary"></b></div>
        <dl id="ticketList"></dl>
      </div>
    </div>
    <form class="form" id="tailorForm" novalidate>
      <fieldset><legend data-i18n="tailor.room"></legend><div class="opts" data-group="room"></div></fieldset>
      <fieldset><legend data-i18n="tailor.piece"></legend><div class="opts" data-group="piece"></div></fieldset>
      <fieldset><legend data-i18n="tailor.style"></legend><div class="opts" data-group="style"></div></fieldset>
      <fieldset><legend data-i18n="tailor.fabric"></legend><div class="opts opts--sw" data-group="fabric"></div></fieldset>
      <div class="row">
        <label class="field"><span data-i18n="tailor.size"></span><input name="size" inputmode="numeric" placeholder="240 × 90"></label>
        <label class="field"><span data-i18n="tailor.name"></span><input name="name" autocomplete="name"></label>
        <label class="field"><span data-i18n="tailor.phone"></span><input name="phone" inputmode="tel" autocomplete="tel" dir="ltr"></label>
      </div>
      <label class="field"><span data-i18n="tailor.notes"></span><textarea name="notes" rows="3"></textarea></label>
      <button class="btn btn--gold btn--lg" type="submit"><span data-i18n="tailor.send"></span></button>
    </form>
  </div>
</section>

<!-- ============ VISIT ============ -->
<section class="visit" id="visit">
  <div class="visit__bg"><img src="assets/img/showroom.webp" alt="" loading="lazy"></div>
  <div class="wrap visit__wrap">
    <div class="visit__card">
      <p class="kicker"><span class="kicker__line"></span><span data-i18n="visit.kicker"></span></p>
      <h2 class="h2" data-i18n="visit.title"></h2>
      <p class="lead" data-i18n="visit.p"></p>
      <dl class="visit__dl">
        <div><dt data-i18n="visit.addr"></dt><dd data-i18n="visit.addr.v"></dd></div>
        <div><dt data-i18n="visit.hours"></dt><dd data-i18n="visit.hours.v"></dd></div>
        <div><dt data-i18n="visit.phone"></dt><dd><a dir="ltr" data-tel href="#" class="num"></a></dd></div>
      </dl>
      <div class="visit__ctas">
        <a class="btn btn--gold" data-wa href="#"><span data-i18n="cta.whatsapp"></span></a>
        <a class="btn btn--ghost" data-tel href="#"><span data-i18n="cta.call"></span></a>
      </div>
    </div>
  </div>
</section>

</main>

<footer class="ftr">
  <div class="wrap ftr__wrap">
    <svg class="ftr__logo" data-logo="full" viewBox="60 368 820 484"></svg>
    <nav class="ftr__nav">
      <a href="#collections" data-i18n="nav.collections"></a>
      <a href="#studio" data-i18n="nav.studio"></a>
      <a href="#showroom" data-i18n="nav.showroom"></a>
      <a href="#tailor" data-i18n="nav.tailor"></a>
      <a href="#visit" data-i18n="nav.visit"></a>
    </nav>
    <div class="ftr__bottom">
      <span>© <span class="num">2026</span> Gamal Elraay Furniture · <span data-i18n="footer.rights"></span></span>
      <a href="https://web.theplanetco.com/" target="_blank" rel="noopener"><span data-i18n="footer.by"></span> <b>Planet Creative Marketing</b></a>
    </div>
  </div>
</footer>

<!-- bottom bar (phones) -->
<div class="bbar">
  <a data-wa href="#"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/></svg><span data-i18n="cta.whatsapp"></span></a>
  <a data-tel href="#"><svg viewBox="0 0 24 24"><path d="M6.6 3h3l1.5 4.5-2 1.3a12 12 0 0 0 6.1 6.1l1.3-2 4.5 1.5v3a2 2 0 0 1-2 2A16.5 16.5 0 0 1 4.6 5a2 2 0 0 1 2-2z"/></svg><span data-i18n="cta.call"></span></a>
  <a href="#tailor"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3"/></svg><span data-i18n="cta.tailor"></span></a>
</div>

<!-- list drawer -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer__panel">
    <div class="drawer__head"><h3 data-i18n="list.title"></h3><button class="x" id="drawerX" aria-label="close">×</button></div>
    <div class="drawer__body" id="drawerBody"></div>
    <a class="btn btn--gold btn--lg drawer__send" id="drawerSend" href="#"><span data-i18n="list.send"></span></a>
  </div>
</aside>

<!-- quick view -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__box">
    <button class="x" id="modalX" aria-label="close">×</button>
    <div class="modal__img"><img id="modalImg" alt=""></div>
    <div class="modal__info">
      <p class="kicker" id="modalCat"></p>
      <h3 id="modalName"></h3>
      <p class="modal__price" id="modalPrice"></p>
      <p class="muted" data-i18n="shop.p"></p>
      <div class="modal__ctas">
        <button class="btn btn--gold" id="modalAdd"></button>
        <a class="btn btn--ghost" id="modalWa" href="#" target="_blank" rel="noopener"><span data-i18n="cta.whatsapp"></span></a>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/vendor/gsap.min.js"></script>
<script src="assets/js/vendor/ScrollTrigger.min.js"></script>
<script src="assets/js/vendor/lenis.min.js"></script>
<script src="assets/js/logo-data.js?v=1"></script>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/data.js?v=1"></script>
<script src="assets/js/app.js?v=2"></script>
</body>
</html>
