<!doctype html>
<html lang="ar" dir="rtl" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>البدوي للأثاث | غرف أطفال تكبر مع أحلامهم</title>
<meta name="description" content="البدوي للأثاث — محمد بدوي: غرف أطفال وبيبي وتينز مصنوعة يدوياً من الخشب الطبيعي، آمنة ومصممة على مقاس غرفتك وأحلام طفلك.">
<meta name="theme-color" content="#FBF6EE">
<meta property="og:title" content="البدوي للأثاث | غرف أطفال">
<meta property="og:description" content="غرف أطفال مصنوعة يدوياً، آمنة، وتكبر مع أحلامهم.">
<meta property="og:image" content="https://web.theplanetco.com/badawy/assets/img/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="assets/img/icon.png">
<link rel="apple-touch-icon" href="assets/img/icon.png">
<link rel="preload" href="assets/fonts/IBMPlexSansArabic-400n-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/InterTight-300_700n-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/seq/f001.webp" as="image">
<link rel="stylesheet" href="assets/css/fonts.css?v=1">
<link rel="stylesheet" href="assets/css/style.css?v=1">
<script>
(function(){try{var t=localStorage.getItem('bd-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
</head>
<body>

<canvas class="sky" id="sky" aria-hidden="true"></canvas>

<!-- ============ INTRO ============ -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro__stage">
    <svg class="intro__mark" id="introMark" viewBox="0 0 1696 1464"></svg>
    <svg class="intro__name" id="introName" viewBox="0 0 1696 360"></svg>
  </div>
  <button class="intro__skip" id="introSkip" data-i18n="intro.skip">تخطي</button>
</div>

<!-- ============ HEADER ============ -->
<header class="hdr" id="hdr">
  <a class="hdr__brand" href="#top" aria-label="Al Badawy Furniture">
    <svg class="hdr__mark" data-logo="mark" viewBox="0 0 1696 1464"></svg>
    <span class="hdr__txt">
      <b data-i18n="brand.name">البدوي للأثاث</b>
      <small data-i18n="brand.sub">غرف أطفال</small>
    </span>
  </a>
  <nav class="hdr__nav" aria-label="main">
    <a href="#ages" data-i18n="nav.ages">حسب العمر</a>
    <a href="#worlds" data-i18n="nav.worlds">العوالم</a>
    <a href="#studio" data-i18n="nav.studio">صمّم غرفته</a>
    <a href="#safety" data-i18n="nav.safety">الأمان</a>
    <a href="#shop" data-i18n="nav.shop">المعرض</a>
    <a href="#visit" data-i18n="nav.visit">زورنا</a>
  </nav>
  <div class="hdr__tools">
    <div class="lang" id="lang">
      <button class="lang__btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <span id="langShort">AR</span>
      </button>
      <ul class="lang__menu" id="langMenu" role="listbox"></ul>
    </div>
    <button class="theme" id="themeBtn" aria-label="day / night">
      <span class="theme__knob"></span>
      <svg class="theme__sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
      <svg class="theme__moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button class="listbtn" id="listBtn" aria-label="my list">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/></svg>
      <b id="listCount">0</b>
    </button>
    <a class="btn btn--gold btn--sm hdr__wa" data-wa href="#"><span data-i18n="cta.whatsapp">واتساب</span></a>
    <button class="burger" id="burger" aria-label="menu"><span></span><span></span></button>
  </div>
</header>

<div class="mnav" id="mnav">
  <nav>
    <a href="#ages" data-i18n="nav.ages">حسب العمر</a>
    <a href="#worlds" data-i18n="nav.worlds">العوالم</a>
    <a href="#studio" data-i18n="nav.studio">صمّم غرفته</a>
    <a href="#safety" data-i18n="nav.safety">الأمان</a>
    <a href="#shop" data-i18n="nav.shop">المعرض</a>
    <a href="#visit" data-i18n="nav.visit">زورنا</a>
  </nav>
  <div class="mnav__langs" id="mnavLangs"></div>
  <a class="btn btn--gold" data-wa href="#"><span data-i18n="cta.whatsapp">واتساب</span></a>
</div>

<main id="top">

<!-- ============ HERO ============ -->
<section class="hero" id="hero">
  <div class="hero__pin">
    <canvas class="hero__canvas" id="heroCanvas"></canvas>
    <img class="hero__night" id="heroNight" src="assets/img/hero_night.webp" alt="" decoding="async">
    <div class="hero__shade"></div>
    <div class="hero__copy">
      <p class="kicker"><span class="kicker__dia"></span><span data-i18n="hero.kicker">البدوي للأثاث · محمد بدوي</span></p>
      <div class="hero__steps">
        <div class="hero__step is-on" data-step="0">
          <h1 data-i18n="hero.s1.t">كل غرفة بتبدأ برسمة.</h1>
          <p data-i18n="hero.s1.p"></p>
        </div>
        <div class="hero__step" data-step="1">
          <h2 data-i18n="hero.s2.t"></h2>
          <p data-i18n="hero.s2.p"></p>
        </div>
        <div class="hero__step" data-step="2">
          <h2 data-i18n="hero.s3.t"></h2>
          <p data-i18n="hero.s3.p"></p>
          <div class="hero__ctas">
            <a class="btn btn--gold" href="#studio" data-i18n="hero.cta1"></a>
            <a class="btn btn--glass" href="#worlds" data-i18n="hero.cta2"></a>
          </div>
        </div>
      </div>
    </div>
    <div class="hero__meter"><span id="heroBar"></span></div>
    <div class="hero__hint"><span class="hero__mouse"></span><span data-i18n="hero.scroll"></span></div>
  </div>
</section>

<!-- ============ MARQUEE ============ -->
<div class="marq" aria-hidden="true"><div class="marq__track" id="marq"></div></div>

<!-- ============ STATEMENT ============ -->
<section class="stmt">
  <div class="wrap">
    <p class="kicker"><span class="kicker__dia"></span><span data-i18n="stmt.kicker"></span></p>
    <p class="stmt__txt" id="stmt"></p>
  </div>
  <span class="blob blob--a" aria-hidden="true"></span><span class="blob blob--b" aria-hidden="true"></span>
</section>

<!-- ============ AGES ============ -->
<section class="ages sec" id="ages">
  <div class="wrap">
    <div class="sec__head">
      <p class="kicker"><span class="kicker__dia"></span><span data-i18n="ages.kicker"></span></p>
      <h2 class="h2" data-i18n="ages.title"></h2>
      <p class="lead" data-i18n="ages.lead"></p>
    </div>
    <div class="ages__rail" id="agesRail" role="tablist"></div>
    <div class="ages__stage">
      <div class="ages__media" id="agesMedia"></div>
      <div class="ages__info" id="agesInfo"></div>
    </div>
  </div>
</section>

<!-- ============ WORLDS ============ -->
<section class="worlds" id="worlds">
  <div class="worlds__pin">
    <div class="wrap worlds__head">
      <div>
        <p class="kicker"><span class="kicker__dia"></span><span data-i18n="worlds.kicker"></span></p>
        <h2 class="h2" data-i18n="worlds.title"></h2>
      </div>
      <p class="lead" data-i18n="worlds.lead"></p>
    </div>
    <div class="worlds__track" id="worldsTrack"></div>
    <div class="worlds__dots" id="worldsDots"></div>
  </div>
</section>

<!-- ============ STUDIO ============ -->
<section class="studio sec" id="studio">
  <div class="wrap">
    <div class="sec__head sec__head--center">
      <p class="kicker"><span class="kicker__dia"></span><span data-i18n="studio.kicker"></span></p>
      <h2 class="h2" data-i18n="studio.title"></h2>
      <p class="lead" data-i18n="studio.lead"></p>
    </div>
    <div class="studio__grid">
      <div class="studio__view">
        <div class="studio__frame" id="studioFrame">
          <img id="studioImg" src="assets/img/hero_room.webp" alt="" decoding="async">
          <img id="studioImg2" class="is-off" src="assets/img/hero_room.webp" alt="" decoding="async">
          <div class="plaque" id="plaque" aria-live="polite">
            <span class="plaque__rope"></span>
            <span class="plaque__board"><span class="plaque__star">✦</span><b id="plaqueName"></b></span>
          </div>
          <span class="studio__badge" id="toneLabel"></span>
        </div>
      </div>
      <form class="studio__panel" id="studioForm" autocomplete="off">
        <fieldset>
          <legend><i>1</i><span data-i18n="studio.tone"></span></legend>
          <div class="tones" id="tones" role="radiogroup"></div>
        </fieldset>
        <fieldset>
          <legend><i>2</i><span data-i18n="studio.name"></span></legend>
          <input class="field" id="kidName" maxlength="14" data-i18n-ph="studio.name.ph" placeholder="اسم طفلك">
        </fieldset>
        <fieldset>
          <legend><i>3</i><span data-i18n="studio.size"></span></legend>
          <div class="seg" id="sizes"></div>
        </fieldset>
        <fieldset>
          <legend><i>4</i><span data-i18n="studio.addons"></span></legend>
          <div class="addons" id="addons"></div>
        </fieldset>
        <div class="studio__total">
          <div>
            <small data-i18n="studio.est"></small>
            <b><span class="num" id="total">0</span> <span data-i18n="shop.currency"></span></b>
            <em data-i18n="studio.note"></em>
          </div>
          <a class="btn btn--gold btn--lg" id="studioSend" href="#" target="_blank" rel="noopener" data-i18n="studio.send"></a>
        </div>
      </form>
    </div>
  </div>
</section>

<!-- ============ SAFETY ============ -->
<section class="safety sec" id="safety">
  <div class="wrap safety__grid">
    <div class="safety__media">
      <img src="assets/img/safe_edge.webp" alt="" loading="lazy" decoding="async">
      <div class="safety__seal">
        <svg viewBox="0 0 120 120"><defs><path id="sealc" d="M60 60m-44 0a44 44 0 1 1 88 0a44 44 0 1 1-88 0"/></defs><text><textPath href="#sealc" id="sealTxt"></textPath></text></svg>
        <span>✦</span>
      </div>
    </div>
    <div>
      <p class="kicker"><span class="kicker__dia"></span><span data-i18n="safety.kicker"></span></p>
      <h2 class="h2" data-i18n="safety.title"></h2>
      <p class="lead" data-i18n="safety.lead"></p>
      <ul class="safety__list" id="safetyList"></ul>
    </div>
  </div>
</section>

<!-- ============ BEFORE / AFTER ============ -->
<section class="ba sec" id="before">
  <div class="wrap">
    <div class="sec__head sec__head--center">
      <p class="kicker"><span class="kicker__dia"></span><span data-i18n="ba.kicker"></span></p>
      <h2 class="h2" data-i18n="ba.title"></h2>
    </div>
    <div class="ba__box" id="baBox">
      <img class="ba__after" src="assets/img/hero_room.webp" alt="" loading="lazy" decoding="async">
      <div class="ba__before" id="baBefore"><img src="assets/img/room_empty.webp" alt="" loading="lazy" decoding="async"></div>
      <span class="ba__tag ba__tag--b" data-i18n="ba.before"></span>
      <span class="ba__tag ba__tag--a" data-i18n="ba.after"></span>
      <div class="ba__handle" id="baHandle"><span>⟷</span></div>
      <input class="ba__range" id="baRange" type="range" min="0" max="100" value="50" aria-label="before / after">
    </div>
  </div>
</section>

<!-- ============ SHOP ============ -->
<section class="shop sec" id="shop">
  <div class="wrap">
    <div class="sec__head shop__head">
      <div>
        <p class="kicker"><span class="kicker__dia"></span><span data-i18n="shop.kicker"></span></p>
        <h2 class="h2" data-i18n="shop.title"></h2>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="muted shop__note" data-i18n="shop.note"></p>
  </div>
</section>

<!-- ============ PROCESS ============ -->
<section class="proc sec" id="process">
  <div class="wrap">
    <div class="sec__head sec__head--center">
      <p class="kicker"><span class="kicker__dia"></span><span data-i18n="proc.kicker"></span></p>
      <h2 class="h2" data-i18n="proc.title"></h2>
    </div>
    <ol class="proc__list" id="procList"></ol>
  </div>
</section>

<!-- ============ FAQ ============ -->
<section class="faq sec" id="faq">
  <div class="wrap faq__grid">
    <div>
      <p class="kicker"><span class="kicker__dia"></span><span data-i18n="faq.kicker"></span></p>
      <h2 class="h2" data-i18n="faq.title"></h2>
      <a class="btn btn--gold" data-wa href="#" data-i18n="faq.ask"></a>
    </div>
    <div class="faq__list" id="faqList"></div>
  </div>
</section>

<!-- ============ VISIT ============ -->
<section class="visit sec" id="visit">
  <div class="wrap">
    <div class="visit__card">
      <div class="visit__copy">
        <p class="kicker"><span class="kicker__dia"></span><span data-i18n="visit.kicker"></span></p>
        <h2 class="h2" data-i18n="visit.title"></h2>
        <p class="lead" data-i18n="visit.lead"></p>
        <ul class="visit__info">
          <li><span data-i18n="visit.addr.l"></span><b data-i18n="visit.addr"></b></li>
          <li><span data-i18n="visit.hours.l"></span><b data-i18n="visit.hours"></b></li>
          <li><span data-i18n="visit.phone.l"></span><b><a class="num" data-tel href="#" dir="ltr"></a></b></li>
        </ul>
        <div class="visit__ctas">
          <a class="btn btn--gold btn--lg" data-wa href="#" data-i18n="cta.whatsapp"></a>
          <a class="btn btn--ghost btn--lg" data-tel href="#" data-i18n="cta.call"></a>
        </div>
      </div>
      <div class="visit__art" aria-hidden="true">
        <svg class="visit__logo" data-logo="full" viewBox="0 0 1696 1856"></svg>
      </div>
    </div>
  </div>
</section>

</main>

<footer class="ftr">
  <div class="wrap ftr__in">
    <svg class="ftr__logo" data-logo="full" viewBox="0 0 1696 1856"></svg>
    <p class="ftr__tag" data-i18n="ftr.tag"></p>
    <nav class="ftr__nav">
      <a href="#ages" data-i18n="nav.ages"></a><a href="#worlds" data-i18n="nav.worlds"></a><a href="#studio" data-i18n="nav.studio"></a><a href="#shop" data-i18n="nav.shop"></a><a href="#visit" data-i18n="nav.visit"></a>
    </nav>
    <p class="ftr__sample" data-i18n="ftr.sample"></p>
    <p class="ftr__credit"><span data-i18n="ftr.credit"></span> <a href="https://theplanetco.com" target="_blank" rel="noopener">Planet Creative Marketing</a></p>
  </div>
</footer>

<!-- wishlist drawer -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer__panel">
    <div class="drawer__head"><h3 data-i18n="list.title"></h3><button class="x" id="drawerX" aria-label="close">✕</button></div>
    <div class="drawer__body" id="drawerBody"></div>
    <div class="drawer__foot"><a class="btn btn--gold" id="listSend" href="#" target="_blank" rel="noopener" data-i18n="list.send"></a></div>
  </div>
</aside>

<!-- quick view -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__box">
    <button class="x modal__x" id="modalX" aria-label="close">✕</button>
    <div class="modal__img"><img id="mImg" alt=""></div>
    <div class="modal__info">
      <p class="kicker" id="mCat"></p>
      <h3 id="mName"></h3>
      <p id="mDesc"></p>
      <p class="modal__price"><small data-i18n="shop.from"></small> <b class="num" id="mPrice"></b> <span data-i18n="shop.currency"></span></p>
      <div class="modal__ctas">
        <a class="btn btn--gold" id="mWa" href="#" target="_blank" rel="noopener" data-i18n="shop.ask"></a>
        <button class="btn btn--ghost" id="mHeart" data-i18n="shop.save"></button>
      </div>
    </div>
  </div>
</div>

<a class="fab" data-wa href="#" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4 5.2 5.2 0 0 0 3.2.7 2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
</a>

<script src="assets/js/vendor/gsap.min.js"></script>
<script src="assets/js/vendor/ScrollTrigger.min.js"></script>
<script src="assets/js/vendor/lenis.min.js"></script>
<script src="assets/js/logo-data.js?v=1"></script>
<script src="assets/js/data.js?v=1"></script>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/app.js?v=1"></script>
</body>
</html>
