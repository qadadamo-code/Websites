<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2);font-weight:600}
@font-face{font-family:Plex;src:url(assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2);font-weight:400}
@font-face{font-family:Manrope;src:url(assets/fonts/manrope-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Manrope;src:url(assets/fonts/manrope-latin-500-normal.woff2);font-weight:500}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#06101c}
#s{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,#123456 0%,#0a1c31 38%,#050b14 75%)}
#ring{position:absolute;left:50%;top:40%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
 background:radial-gradient(circle,#92C5B4 0%,#5f9c89 55%,#2c5d57 100%);box-shadow:0 0 140px 30px rgba(146,197,180,.35)}
#logo{position:absolute;left:50%;top:40%;width:250px;height:250px;margin:-125px 0 0 -125px}
#logo svg{width:100%;height:100%}
#logo path{fill:#143659}
#nm{position:absolute;top:68.4%;width:100%;text-align:center;font:800 64px Manrope;letter-spacing:.42em;color:#eaf4f0;direction:ltr;text-indent:.42em}
#sv{position:absolute;top:85.6%;width:100%;text-align:center;font:400 34px Plex;color:#cfe3dc}
#cm{position:absolute;top:75.6%;width:100%;text-align:center;font:500 26px Manrope;letter-spacing:.5em;text-indent:.5em;color:#92C5B4;direction:ltr}
#ar{position:absolute;top:80.2%;width:100%;text-align:center;font:600 40px Plex;color:#92C5B4}
#row{position:absolute;top:91.2%;width:100%;display:flex;justify-content:center;gap:28px;direction:ltr}
#ring,#logo{top:36%!important}
.pill{font:500 30px Manrope;color:#eaf4f0;border:2px solid rgba(146,197,180,.7);border-radius:60px;padding:10px 34px;background:rgba(20,54,89,.55)}
.pill b{color:#92C5B4;font-weight:800}
#flash{position:absolute;inset:0;background:#dff3ec}
</style></head><body>
<div id="s"></div><div id="ring"></div><div id="logo"></div>
<div id="nm">PLANET</div><div id="cm">CREATIVE MARKETING</div>
<div id="ar">وكالة تسويق متكاملة</div><div id="sv">تسويق · إدارة منصات · براندينج · مواقع · تطبيقات</div>
<div id="row"><div class="pill">www.<b>theplanetco</b>.com</div><div class="pill">WhatsApp <b>01203101104</b></div></div>
<div id="flash"></div>
<script>
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const back=x=>{x=Math.min(1,Math.max(0,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function render(t){ // t seconds from end-card start (0..2)
  flash.style.opacity=Math.max(0,1-t/0.16);
  const r=back(t/0.45); ring.style.transform=`scale(${0.2+0.8*r})`; ring.style.opacity=Math.min(1,t/0.1);
  logo.style.transform=`scale(${0.6+0.4*back((t-0.08)/0.45)}) rotate(${(1-ease((t-0.08)/0.5))*-25}deg)`;logo.style.opacity=Math.min(1,Math.max(0,(t-0.08)/0.12));
  const n=ease((t-0.35)/0.45); nm.style.opacity=n; cm.style.opacity=ease((t-0.45)/0.4); nm.style.letterSpacing=(0.9-0.48*n)+'em';
  const a=ease((t-0.55)/0.4); ar.style.opacity=a; ar.style.transform=`translateY(${(1-a)*30}px)`; const v=ease((t-0.65)/0.4); sv.style.opacity=v; sv.style.transform=`translateY(${(1-v)*30}px)`;
  const p=ease((t-0.75)/0.4); row.style.opacity=p; row.style.transform=`translateY(${(1-p)*30}px)`;
  const z=1+0.03*t; document.body.style.transform=`scale(${z})`;
}

</script></body></html>
